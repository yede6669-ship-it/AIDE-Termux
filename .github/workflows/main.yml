name: Android CI (Atomic Fix)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK & SDK
      uses: android-actions/setup-android@v3

    - name: Install Build Tools
      run: |
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653" "platforms;android-33" "build-tools;30.0.3"

    - name: Use JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle

    - name: Clean & Wrapper
      run: |
        find . -name "build" -type d -exec rm -rf {} +
        find . -name ".gradle" -type d -exec rm -rf {} +
        mkdir -p gradle/wrapper
        curl -L https://raw.githubusercontent.com/gradle/gradle/v6.7.1/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
        printf "distributionBase=GRADLE_USER_HOME\ndistributionPath=wrapper/dists\ndistributionUrl=https\://services.gradle.org/distributions/gradle-6.7.1-all.zip\nzipStoreBase=GRADLE_USER_HOME\nzipStorePath=wrapper/dists\n" > gradle/wrapper/gradle-wrapper.properties
        curl -L https://raw.githubusercontent.com/gradle/gradle/v6.7.1/gradlew -o gradlew
        chmod +x gradlew

    - name: Atomic Project Reconstruction
      run: |
        # 1. 重建 settings.gradle
        MODULES=$(find . -maxdepth 2 -name "build.gradle" -not -path "./build.gradle" | sed "s|\./\(.*\)/build\.gradle|'\:\1'|" | paste -sd "," - | sed 's/,/, /g')
        echo "include $MODULES" > settings.gradle

        # 2. 重建根目录 build.gradle (使用单引号防止转义)
        printf "buildscript {\n    repositories { google(); mavenCentral() }\n    dependencies { classpath 'com.android.tools.build:gradle:4.1.0' }\n}\nallprojects {\n    repositories { google(); mavenCentral() }\n}\n" > build.gradle

        # 3. 逐个模块重建
        find . -maxdepth 2 -name "build.gradle" -not -path "./build.gradle" | while read -r file; do
          MOD_DIR=$(dirname "$file")
          mkdir -p "$MOD_DIR/src/main"
          
          # 寻找并移动 Manifest
          REAL_M=$(find "$MOD_DIR" -name "AndroidManifest.xml" -not -path "*/build/*" | head -n 1)
          [ -n "$REAL_M" ] && [ "$REAL_M" != "$MOD_DIR/src/main/AndroidManifest.xml" ] && cp "$REAL_M" "$MOD_DIR/src/main/AndroidManifest.xml"

          # 修复 Manifest 内容
          MPATH="$MOD_DIR/src/main/AndroidManifest.xml"
          if [ ! -f "$MPATH" ]; then
            echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.termux" />' > "$MPATH"
          else
            sed -i 's/\${applicationId}/com.termux/g' "$MPATH"
            grep -q "package=" "$MPATH" || sed -i 's/<manifest/<manifest package="com.termux"/g' "$MPATH"
          fi

          # 4. 生成洁净的 build.gradle
          PLUGIN="com.android.library"
          [[ "$MOD_DIR" == *"app"* ]] && PLUGIN="com.android.application"
          
          # 使用 printf 构建以确保换行和缩进安全
          printf "apply plugin: '$PLUGIN'\nandroid {\n    compileSdkVersion 33\n    buildToolsVersion '30.0.3'\n    defaultConfig {\n" > "${file}.tmp"
          [[ "$PLUGIN" == "com.android.application" ]] && printf "        applicationId 'com.termux'\n" >> "${file}.tmp"
          printf "        minSdkVersion 21\n        targetSdkVersion 33\n        versionCode 1\n        versionName '1.0'\n        manifestPlaceholders = [applicationId: 'com.termux']\n    }\n    aaptOptions { namespaced = false }\n    lintOptions { abortOnError false }\n}\ndependencies {\n    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])\n" >> "${file}.tmp"
          
          # 恢复原始 implementation 依赖
          grep "implementation" "$file" | grep -v "project(" >> "${file}.tmp" || true
          printf "}\n" >> "${file}.tmp"
          mv "${file}.tmp" "$file"
        done

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: AIDE-Termux-Atomic-Build
        path: |
          **/build/outputs/apk/**/*.apk
          **/build/outputs/aar/**/*.aar
