name: Android CI (Auto-Discovery Mode)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 17 (For SDK Manager)
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install NDK
      run: |
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653"

    - name: Switch to JDK 11 (For Build)
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle

    - name: Force Inject Gradle Wrapper
      run: |
        mkdir -p gradle/wrapper
        curl -L https://raw.githubusercontent.com/gradle/gradle/v6.7.1/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
        printf "distributionBase=GRADLE_USER_HOME\ndistributionPath=wrapper/dists\ndistributionUrl=https\://services.gradle.org/distributions/gradle-6.7.1-all.zip\nzipStoreBase=GRADLE_USER_HOME\nzipStorePath=wrapper/dists\n" > gradle/wrapper/gradle-wrapper.properties
        curl -L https://raw.githubusercontent.com/gradle/gradle/v6.7.1/gradlew -o gradlew
        chmod +x gradlew

    - name: Auto-Repair Project Structure
      run: |
        # 1. 动态生成 settings.gradle
        # 扫描所有包含 build.gradle 的子目录（排除根目录本身），并转换成 Gradle 模块格式
        echo "🚀 正在自动扫描子模块..."
        MODULES=$(find . -maxdepth 2 -name "build.gradle" -not -path "./build.gradle" | sed 's/\.\/\(.*\)\/build\.gradle/:\1/' | paste -sd "," - | sed 's/,/, /g')
        echo "include $MODULES" > settings.gradle
        echo "✅ 识别到模块: $(cat settings.gradle)"

        # 2. 彻底重写根目录 build.gradle (保持干净的插件路径)
        cat <<EOF > build.gradle
        buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:4.1.0' }
        }
        allprojects {
            repositories { google(); mavenCentral() }
        }
        EOF

        # 3. 批量清洗所有子模块的语法
        find . -name "*.gradle" -type f -exec sed -i 's/JavaVersion.VERSION_8/JavaVersion.VERSION_1_8/g' {} +
        find . -name "*.gradle" -type f -exec sed -i '/buildFeatures/,/}/d' {} +
        find . -name "*.gradle" -type f -exec sed -i 's/jcenter()/mavenCentral()/g' {} +

        # 4. 确保 app 模块和可能存在的库模块都有正确插件定义
        # 如果文件夹叫 app，就用 application，否则根据内容猜测或补全
        if [ -d "app" ]; then
           if ! grep -q "com.android.application" app/build.gradle; then
              sed -i '1i apply plugin: "com.android.application"' app/build.gradle
           fi
        fi

    - name: Build All Modules
      # 使用 assembleDebug 往往比 Release 更容易成功（不需要签名配置）
      run: ./gradlew assembleDebug -x lint --stacktrace --no-daemon

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: AIDE-Termux-Debug-Build
        path: |
          **/build/outputs/apk/**/*.apk
