name: Android CI (Final Multi-Module Fix)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # 1. 环境准备
    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      env:
        JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}

    - name: Set up Java 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    # 2. 注入全局配置并自动修复旧语法
    - name: Inject Project Infrastructure & Fix Legacy Syntax
      run: |
        # 创建根目录 build.gradle，强制统一插件版本
        cat <<'EOF' > build.gradle
        buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:7.4.2' }
        }
        allprojects {
            repositories { google(); mavenCentral() }
        }
        EOF

        # 强制生成全局配置
        cat <<'EOF' > gradle.properties
        android.useAndroidX=true
        android.enableJetifier=true
        android.suppressUnsupportedCompileSdk=31
        EOF

        # 强制生成全局模块包含声明
        cat <<'EOF' > settings.gradle
        include ':app', ':terminal-emulator', ':terminal-view', ':termux-shared'
        EOF

        # --- 核心步骤：自动手术修复旧语法 ---
        # 遍历所有 build.gradle，把古老的 'compile' 换成现代的 'implementation'
        # 同时把 'testCompile' 换成 'testImplementation'
        echo "Updating legacy Gradle syntax..."
        find . -name "build.gradle" -exec sed -i 's/\bcompile\b/implementation/g' {} +
        find . -name "build.gradle" -exec sed -i 's/testCompile/testImplementation/g' {} +

        # 3. 强制重写主 app 模块配置，确保关联和 JNI 路径正确
        mkdir -p app
        cat <<'EOF' > app/build.gradle
        apply plugin: 'com.android.application'
        android {
            compileSdk 31
            namespace "com.termux"
            defaultConfig {
                applicationId "com.termux"
                minSdk 21
                targetSdk 31
                versionCode 1
                versionName "1.0"
                ndk { abiFilters 'arm64-v8a' }
            }
            sourceSets {
                main {
                    // 指向你存放 .so 文件的目录
                    jniLibs.srcDirs = ['src/main/jniLibs']
                }
            }
            packagingOptions {
                // 关键：防止 Termux 二进制文件被损坏
                doNotStrip "**/libtermux-bootstrap.so"
                doNotStrip "**/libproot.so"
                doNotStrip "**/libLoader.so"
                resources {
                    excludes += '/META-INF/{AL2.0,LGPL2.1}'
                }
            }
        }
        dependencies {
            implementation project(':terminal-emulator')
            implementation project(':terminal-view')
            implementation project(':termux-shared')
            implementation 'androidx.appcompat:appcompat:1.3.1'
            implementation 'com.google.android.material:material:1.4.0'
        }
        EOF

    # 3. 设置 Gradle 7.5
    - name: Setup Gradle 7.5
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 7.5
        cache-disabled: true

    # 4. 执行编译
    - name: Build APK
      run: |
        export JAVA_HOME=$JAVA_HOME_11_X64
        export PATH=$JAVA_HOME/bin:$PATH
        
        # 自动选择 gradlew 或全局 gradle
        if [ -f "./gradlew" ]; then
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
        else
          gradle :app:assembleDebug --no-daemon --stacktrace
        fi

    # 5. 上传产物
    - name: Upload Success APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: Termux-AIDE-Fixed-Build
        path: "app/build/outputs/apk/debug/*.apk"
