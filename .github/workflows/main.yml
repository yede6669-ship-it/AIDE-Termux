name: Android CI (AAR Metadata Fix)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      env:
        JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}

    - name: Set up Java 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Project Reconstruction & Metadata Fix
      run: |
        # 1. 自动归位 (保持原有逻辑)
        EMULATOR_PATH=$(find . -maxdepth 3 -name "terminal-emulator" -type d | head -n 1)
        VIEW_PATH=$(find . -maxdepth 3 -name "terminal-view" -type d | head -n 1)
        SHARED_PATH=$(find . -maxdepth 3 -name "termux-shared" -type d | head -n 1)
        APP_PATH=$(find . -maxdepth 3 -name "app" -type d | head -n 1)
        [ -n "$EMULATOR_PATH" ] && mv "$EMULATOR_PATH" ./terminal-emulator || true
        [ -n "$VIEW_PATH" ] && mv "$VIEW_PATH" ./terminal-view || true
        [ -n "$SHARED_PATH" ] && mv "$SHARED_PATH" ./termux-shared || true
        [ -n "$APP_PATH" ] && mv "$APP_PATH" ./app || true

        # 2. 语法清理
        find . -name "build.gradle" -exec sed -i 's/\bcompile\b/implementation/g' {} +

        # 3. 根配置：加入 JitPack 并强制全局降级
        cat <<'EOF' > build.gradle
        buildscript {
            repositories { google(); mavenCentral(); maven { url 'https://jitpack.io' } }
            dependencies { classpath 'com.android.tools.build:gradle:7.4.2' }
        }
        allprojects {
            repositories { google(); mavenCentral(); maven { url 'https://jitpack.io' } }
            // 关键：强制全局依赖替换，防止任何 1.4.0-alpha05 进入构建
            configurations.all {
                resolutionStrategy.eachDependency { details ->
                    if (details.requested.group == 'androidx.window') {
                        details.useVersion '1.0.0'
                    }
                }
            }
        }
        EOF

        cat <<'EOF' > settings.gradle
        include ':app', ':terminal-emulator', ':terminal-view', ':termux-shared'
        EOF

        cat <<'EOF' > gradle.properties
        android.useAndroidX=true
        android.enableJetifier=true
        android.suppressUnsupportedCompileSdk=31
        EOF

        # 4. 重载 app 模块配置：提高容错率
        cat <<'EOF' > app/build.gradle
        apply plugin: 'com.android.application'
        android {
            compileSdk 31
            namespace "com.termux"
            defaultConfig {
                applicationId "com.termux"
                minSdk 21
                targetSdk 31
                ndk { abiFilters 'arm64-v8a' }
            }
            // 忽略 AAR 元数据检查中的版本冲突（针对 androidx.window）
            lintOptions {
                checkReleaseBuilds false
                abortOnError false
            }
            sourceSets { main { jniLibs.srcDirs = ['src/main/jniLibs'] } }
            packagingOptions {
                doNotStrip "**/libtermux-bootstrap.so"
                doNotStrip "**/libproot.so"
                doNotStrip "**/libLoader.so"
                pickFirsts += '**/libc++_shared.so'
            }
        }
        dependencies {
            implementation project(':terminal-emulator')
            implementation project(':terminal-view')
            implementation project(':termux-shared')
            implementation 'androidx.appcompat:appcompat:1.3.1'
            implementation 'com.google.android.material:material:1.4.0'
        }
        EOF

    - name: Setup Gradle 7.5
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 7.5

    - name: Build APK
      run: |
        export JAVA_HOME=$JAVA_HOME_11_X64
        export PATH=$JAVA_HOME/bin:$PATH
        # 使用 --refresh-dependencies 强行刷掉之前的错误缓存
        gradle :app:assembleDebug --no-daemon --refresh-dependencies

    - name: Upload
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: Termux-Success-Build
        path: "app/build/outputs/apk/debug/*.apk"
