name: Android CI (Package Fix)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Match Package Name & Fix Manifest
      run: |
        # 1. 模块归位
        for m in "terminal-emulator" "terminal-view" "termux-shared" "app"; do
          P=$(find . -maxdepth 3 -name "$m" -type d | head -n 1)
          [ -n "$P" ] && [ "$P" != "./$m" ] && mv "$P" "./$m" || true
        done

        # 2. 移除 Manifest 中的 package 属性（防止 Gradle 8.x 报错）
        # 我们直接删除 package="..." 这段代码，改由 build.gradle 的 namespace 控制
        find . -name "AndroidManifest.xml" -exec sed -i 's/package="[^"]*"//g' {} +

        # 3. 修复代码引用与 Log
        find . -name "*.java" -exec sed -i 's/import com.termux.shared.R;/import com.termux.R;/g' {} +
        find . -name "*.java" -exec sed -i 's/import com.termux.view.R;/import com.termux.R;/g' {} +
        find . -name "*.java" -exec sed -i 's/com.termux.shared.R./com.termux.R./g' {} +
        find . -name "*.java" -exec sed -i 's/com.termux.view.R./com.termux.R./g' {} +
        find . -name "*.java" -exec sed -i 's/import com.termux.app.BuildConfig;/import com.termux.BuildConfig;/g' {} +
        find . -name "*.java" -exec sed -i 's/import com.termux.shared.BuildConfig;/import com.termux.BuildConfig;/g' {} +
        find . -name "*.java" -exec sed -i 's/io.github.zeroaicy.util.Log/android.util.Log/g' {} +
        find . -name "*.java" -exec sed -i 's/Log.d("/Log.d("Termux", "/g' {} +

        # 4. 资源去重
        find termux-shared/src/main/res/ -type f | while read file; do
            filename=$(basename "$file")
            dirname=$(basename $(dirname "$file"))
            if [ "$dirname" != "values" ]; then
                find app/src/main/res/ -name "$filename" -exec rm -f "$file" \;
            fi
        done

        # 5. 生成基础构建脚本
        echo "include ':app', ':terminal-emulator'" > settings.gradle
        cat <<'EOF' > build.gradle
        buildscript {
            repositories { google(); mavenCentral(); maven { url 'https://jitpack.io' } }
            dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
        }
        allprojects {
            repositories { google(); mavenCentral(); maven { url 'https://jitpack.io' } }
        }
        EOF

        # 6. 配置 terminal-emulator (使用对应的 namespace)
        cat <<'EOF' > terminal-emulator/build.gradle
        apply plugin: 'com.android.library'
        android {
            compileSdk 34
            namespace "com.termux.terminal"
            defaultConfig { minSdk 21 }
        }
        dependencies { implementation 'androidx.annotation:annotation:1.7.0' }
        EOF

        # 7. 配置主 App (应用包名设为 com.aide.termux)
        cat <<'EOF' > app/build.gradle
        apply plugin: 'com.android.application'
        android {
            compileSdk 34
            namespace "com.termux"
            defaultConfig {
                applicationId "com.aide.termux"
                minSdk 21
                targetSdk 34
                versionCode 1
                versionName "1.0"
                ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
            }
            buildFeatures {
                buildConfig = true
            }
            sourceSets {
                main {
                    java.srcDirs = ['src/main/java', '../termux-shared/src/main/java', '../terminal-view/src/main/java']
                    res.srcDirs = ['src/main/res', '../termux-shared/src/main/res', '../terminal-view/src/main/res']
                    manifest.srcFile 'src/main/AndroidManifest.xml'
                }
            }
        }
        dependencies {
            implementation project(':terminal-emulator')
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.11.0'
            implementation 'androidx.preference:preference:1.2.1'
            implementation 'androidx.window:window:1.2.0'
            implementation 'com.google.guava:guava:33.0.0-android'
            implementation 'com.google.code.findbugs:jsr305:3.0.2'
            implementation 'commons-io:commons-io:2.15.1'
            implementation 'org.lsposed.hiddenapibypass:hiddenapibypass:4.3'
            implementation 'com.termux:termux-am-library:v2.0.0'
            implementation 'io.noties.markwon:core:4.6.2'
            implementation 'io.noties.markwon:ext-strikethrough:4.6.2'
            implementation 'io.noties.markwon:linkify:4.6.2'
            implementation 'io.noties.markwon:recycler:4.6.2'
            implementation 'com.atlassian.commonmark:commonmark:0.17.0'
            implementation 'androidx.annotation:annotation:1.7.0'
        }
        EOF

        echo "android.useAndroidX=true" > gradle.properties
        echo "android.enableJetifier=true" >> gradle.properties
        echo "android.nonTransitiveRClass=false" >> gradle.properties

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.5

    - name: Build Debug APK
      run: |
        gradle :app:assembleDebug --no-daemon -x lint

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: AIDE-Termux-Fixed
        path: app/build/outputs/apk/debug/app-debug.apk
