name: Android CI (Gradle 7 Upgrade Fix)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Atomic Project Reset
      run: |
        # 彻底清理残留
        find . -maxdepth 1 ! -name '.' ! -name '.git' ! -name '.github' -exec rm -rf {} +
        
        # 创建标准目录
        mkdir -p app/src/main/java app/src/main/res/values
        
        # 写入纯净清单
        cat <<'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.termux">
            <application android:label="Termux"/>
        </manifest>
        EOF

        # 写入基础资源
        echo '<resources><string name="app_name">Termux</string></resources>' > app/src/main/res/values/strings.xml

        # 写入 settings.gradle
        echo "include ':app'" > settings.gradle

    - name: Configure Modern Gradle Files
      run: |
        # 升级 AGP 到 7.0.4
        cat <<'EOF' > build.gradle
        buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:7.0.4' }
        }
        allprojects {
            repositories { google(); mavenCentral() }
        }
        EOF

        # 升级模块配置
        cat <<'EOF' > app/build.gradle
        apply plugin: 'com.android.application'
        android {
            compileSdk 33
            defaultConfig {
                applicationId "com.termux"
                minSdk 21
                targetSdk 33
                versionCode 1
                versionName "1.0"
            }
        }
        dependencies {
            implementation 'androidx.appcompat:appcompat:1.3.1'
        }
        EOF

    - name: Setup Gradle 7.3.3
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 7.3.3  # 关键：跳过出问题的 6.7.1
        cache-disabled: true

    - name: Build APK
      run: |
        # Gradle 7 不需要复杂的 GRADLE_OPTS
        gradle assembleDebug --no-daemon --stacktrace

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: Termux-Gradle7-Build
        path: "app/build/outputs/apk/debug/*.apk"
