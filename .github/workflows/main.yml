name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  # 强制使用 Node 24 解决弃用警告
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install NDK
      run: |
        # 安装 il2Fusion 推荐的 NDK 版本
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653"

    - name: Restore or Generate Gradle Wrapper
      run: |
        # 核心修复：如果找不到 gradlew，就地生成一个
        if [ ! -f "gradlew" ]; then
          echo "⚠️ 仓库中缺失 gradlew，正在自动生成构建环境..."
          gradle wrapper --gradle-version 8.5
        fi
        chmod +x gradlew

    - name: Build Release Binaries
      # --stacktrace 方便报错时查看具体原因
      # --no-daemon 节省 CI 内存
      run: ./gradlew assembleRelease --stacktrace --no-daemon

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: il2Fusion-Release-Package
        path: |
          **/build/outputs/apk/release/*.apk
          **/build/outputs/zygisk/*.zip
