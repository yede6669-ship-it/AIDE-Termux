name: Android CI (Atomic Fix)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK & SDK
      uses: android-actions/setup-android@v3

    - name: Install Build Tools
      run: |
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653" "platforms;android-33" "build-tools;30.0.3"

    - name: Use JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle

    - name: Clean & Wrapper
      run: |
        # 物理清理所有残留缓存
        find . -name "build" -type d -exec rm -rf {} +
        find . -name ".gradle" -type d -exec rm -rf {} +
        
        mkdir -p gradle/wrapper
        curl -L https://raw.githubusercontent.com/gradle/gradle/v6.7.1/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
        printf "distributionBase=GRADLE_USER_HOME\ndistributionPath=wrapper/dists\ndistributionUrl=https\://services.gradle.org/distributions/gradle-6.7.1-all.zip\nzipStoreBase=GRADLE_USER_HOME\nzipStorePath=wrapper/dists\n" > gradle/wrapper/gradle-wrapper.properties
        curl -L https://raw.githubusercontent.com/gradle/gradle/v6.7.1/gradlew -o gradlew
        chmod +x gradlew

    - name: Atomic Project Reconstruction
      run: |
        # 1. 重建 settings.gradle，排除自身
        MODULES=$(find . -maxdepth 2 -name "build.gradle" -not -path "./build.gradle" | sed "s|\./\(.*\)/build\.gradle|'\:\1'|" | paste -sd "," - | sed 's/,/, /g')
        echo "include $MODULES" > settings.gradle

        # 2. 重建根目录 build.gradle
        cat << 'EOF' > build.gradle
        buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:4.1.0' }
        }
        allprojects {
            repositories { google(); mavenCentral() }
        }
        EOF

        # 3. 逐个模块精准手术
        echo "🚀 执行原子级模块重建..."
        find . -maxdepth 2 -name "build.gradle" -not -path "./build.gradle" | while read -r file; do
          MOD_DIR=$(dirname "$file")
          
          # 创建标准目录
          mkdir -p "$MOD_DIR/src/main"
          
          # 寻找 Manifest，排除 build 目录
          REAL_MANIFEST=$(find "$MOD_DIR" -name "AndroidManifest.xml" -not -path "*/build/*" | head -n 1)
          if [ -n "$REAL_MANIFEST" ] && [ "$REAL_MANIFEST" != "$MOD_DIR/src/main/AndroidManifest.xml" ]; then
             cp "$REAL_MANIFEST" "$MOD_DIR/src/main/AndroidManifest.xml"
          fi

          # 注入 Manifest 信息
          MPATH="$MOD_DIR/src/main/AndroidManifest.xml"
          if [ ! -f "$MPATH" ]; then
            echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.termux" />' > "$MPATH"
          else
            sed -i 's/\${applicationId}/com.termux/g' "$MPATH"
            if ! grep -q "package=" "$MPATH"; then
              sed -i 's/<manifest/<manifest package="com.termux"/g' "$MPATH"
            fi
          fi

          # 4. 生成洁净的 build.gradle
          PKG_NAME="com.termux"
          PLUGIN="com.android.library"
          if [[ "$MOD_DIR" == *"app"* ]]; then PLUGIN="com.android.application"; fi
          
          cat <<EOF > "${file}.tmp"
        apply plugin: '$PLUGIN'
        android {
            compileSdkVersion 33
            buildToolsVersion '30.0.3'
            defaultConfig {
                if ('$PLUGIN' == 'com.android.application') { applicationId '$PKG_NAME' }
                minSdkVersion 21
                targetSdkVersion 33
                versionCode 1
                versionName '1.0'
                manifestPlaceholders = [applicationId: '$PKG_NAME']
            }
            aaptOptions { namespaced = false }
            lintOptions { abortOnError false }
        }
        dependencies {
            implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])
EOF
          # 尝试追加原有的外部库依赖，但跳过 project() 依赖以防循环引用
          if grep -q "dependencies {" "$file"; then
             grep "implementation" "$file" | grep -v "project(" >> "${file}.tmp" || true
          fi
          echo "}" >> "${file}.tmp"
          mv "${file}.tmp" "$file"
        done

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: AIDE-Termux-Atomic-Build
        path: |
          **/build/outputs/apk/**/*.apk
          **/build/outputs/aar/**/*.aar
