name: Android CI (Termux Final Precise)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Reconstruction Project Structure
      run: |
        # 1. 彻底清理并创建标准目录
        rm -rf aide-termux app terminal-emulator terminal-view termux-shared settings.gradle build.gradle
        mkdir -p aide-termux/src/main/java app/src/main/java terminal-emulator/src/main/java terminal-view/src/main/java termux-shared/src/main/java

        # 2. 物理归位清单文件 (基于你上传的文件名)
        cp "AndroidManifest.xml"     "aide-termux/src/main/AndroidManifest.xml" || touch "aide-termux/src/main/AndroidManifest.xml"
        cp "AndroidManifest (1).xml" "app/src/main/AndroidManifest.xml" || touch "app/src/main/AndroidManifest.xml"
        cp "AndroidManifest (2).xml" "terminal-emulator/src/main/AndroidManifest.xml" || touch "terminal-emulator/src/main/AndroidManifest.xml"
        cp "AndroidManifest (3).xml" "terminal-view/src/main/AndroidManifest.xml" || touch "terminal-view/src/main/AndroidManifest.xml"
        cp "AndroidManifest (4).xml" "termux-shared/src/main/AndroidManifest.xml" || touch "termux-shared/src/main/AndroidManifest.xml"

        # 3. 生成根目录 build.gradle
        cat <<'EOF' > build.gradle
        buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:4.1.0' }
        }
        allprojects {
            repositories { google(); mavenCentral() }
        }
        EOF

        # 4. 生成 settings.gradle
        echo "include ':aide-termux', ':app', ':terminal-emulator', ':terminal-view', ':termux-shared'" > settings.gradle

        # 5. 生成各模块 build.gradle (避开函数，直接写入以防止转义错误)
        
        # --- aide-termux (Application) ---
        cat <<'EOF' > aide-termux/build.gradle
        apply plugin: 'com.android.application'
        android {
            compileSdkVersion 33
            defaultConfig {
                applicationId "com.aide.termux"
                minSdkVersion 24
                targetSdkVersion 33
            }
            sourceSets { main { manifest.srcFile 'src/main/AndroidManifest.xml'; java.srcDirs = ['src/main/java'] } }
        }
        dependencies {
            implementation 'androidx.appcompat:appcompat:1.3.1'
            implementation project(':app')
        }
        EOF

        # --- app (Application) ---
        cat <<'EOF' > app/build.gradle
        apply plugin: 'com.android.application'
        android {
            compileSdkVersion 33
            defaultConfig {
                applicationId "com.termux"
                minSdkVersion 21
                targetSdkVersion 33
            }
            sourceSets { main { manifest.srcFile 'src/main/AndroidManifest.xml'; java.srcDirs = ['src/main/java'] } }
        }
        dependencies {
            implementation 'androidx.appcompat:appcompat:1.3.1'
            implementation 'com.google.android.material:material:1.4.0'
            implementation project(':terminal-emulator')
            implementation project(':terminal-view')
            implementation project(':termux-shared')
        }
        EOF

        # --- terminal-emulator (Library) ---
        cat <<'EOF' > terminal-emulator/build.gradle
        apply plugin: 'com.android.library'
        android {
            compileSdkVersion 33
            defaultConfig { minSdkVersion 21 }
            sourceSets { main { manifest.srcFile 'src/main/AndroidManifest.xml'; java.srcDirs = ['src/main/java'] } }
        }
        dependencies { implementation 'androidx.annotation:annotation:1.3.0' }
        EOF

        # --- terminal-view (Library) ---
        cat <<'EOF' > terminal-view/build.gradle
        apply plugin: 'com.android.library'
        android {
            compileSdkVersion 33
            defaultConfig { minSdkVersion 21 }
            sourceSets { main { manifest.srcFile 'src/main/AndroidManifest.xml'; java.srcDirs = ['src/main/java'] } }
        }
        dependencies {
            implementation project(':terminal-emulator')
            implementation 'androidx.annotation:annotation:1.3.0'
        }
        EOF

        # --- termux-shared (Library) ---
        cat <<'EOF' > termux-shared/build.gradle
        apply plugin: 'com.android.library'
        android {
            compileSdkVersion 33
            defaultConfig { minSdkVersion 21 }
            sourceSets { main { manifest.srcFile 'src/main/AndroidManifest.xml'; java.srcDirs = ['src/main/java'] } }
        }
        dependencies {
            implementation 'androidx.appcompat:appcompat:1.3.1'
            implementation 'com.google.guava:guava:31.1-android'
        }
        EOF

        # 6. 统一修正清单占位符
        find . -name "AndroidManifest.xml" -exec sed -i 's/\${applicationId}/com.termux/g' {} +

    - name: Download Compatible Gradle
      run: |
        wget -q https://services.gradle.org/distributions/gradle-6.7.1-bin.zip
        unzip -q gradle-6.7.1-bin.zip
        echo "$(pwd)/gradle-6.7.1/bin" >> $GITHUB_PATH

    - name: Build Debug APK
      run: |
        gradle assembleDebug --no-daemon --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: AIDE-Termux-Final-Release
        path: "**/build/outputs/apk/**/*.apk"
