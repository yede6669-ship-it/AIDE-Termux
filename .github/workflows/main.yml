name: Android CI (Full Source Recovery)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # 1. 满足 SDK Manager 的 JDK 17 环境
    - name: Set up JDK 17 (For SDK Tooling)
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    # 2. 切换回满足 Gradle 6.7.1 的 JDK 11 环境
    - name: Set up JDK 11 (For Compilation)
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Project Reconstruction & Source Salvage
      run: |
        # 创建标准的 Gradle 结构
        rm -rf aide-termux app terminal-emulator terminal-view termux-shared
        mkdir -p aide-termux/src/main/java app/src/main/java terminal-emulator/src/main/java terminal-view/src/main/java termux-shared/src/main/java
        mkdir -p app/src/main/res/values aide-termux/src/main/res/values

        # --- 核心：打捞源码 ---
        # 搜索仓库中所有 .java 文件，并尝试放入 app 模块（最稳妥的策略）
        find . -name "*.java" ! -path "*/src/main/java/*" -exec cp --parents {} app/src/main/java/ \; || true
        
        # 搜索所有资源文件夹并合并
        find . -name "res" -type d ! -path "*/src/main/res*" -exec cp -r {}/.. app/src/main/ \; || true

        # --- 写入基础配置文件 ---
        echo "include ':aide-termux', ':app', ':terminal-emulator', ':terminal-view', ':termux-shared'" > settings.gradle

        cat <<'EOF' > build.gradle
        buildscript {
            repositories { google(); mavenCentral(); jcenter() }
            dependencies { classpath 'com.android.tools.build:gradle:4.1.0' }
        }
        allprojects {
            repositories { google(); mavenCentral(); jcenter(); maven { url "https://jitpack.io" } }
        }
        EOF

        # 确保每个模块都有 AndroidManifest.xml (否则 Gradle 不会将其视为 Android 模块)
        echo '<manifest package="com.aide.termux"><application/></manifest>' > aide-termux/src/main/AndroidManifest.xml
        echo '<manifest package="com.termux"><application/></manifest>' > app/src/main/AndroidManifest.xml
        echo '<manifest package="com.termux.terminal"/>' > terminal-emulator/src/main/AndroidManifest.xml
        echo '<manifest package="com.termux.view"/>' > terminal-view/src/main/AndroidManifest.xml
        echo '<manifest package="com.termux.shared"/>' > termux-shared/src/main/AndroidManifest.xml

        # 补全基础资源防止 AAPT 报错
        echo '<resources><string name="app_name">Termux</string></resources>' > app/src/main/res/values/strings.xml

        # --- 模块依赖配置 ---
        echo "apply plugin: 'com.android.application'; android { compileSdkVersion 33; buildToolsVersion '30.0.3'; defaultConfig { applicationId 'com.aide.termux'; minSdkVersion 24 } }; dependencies { implementation project(':app') }" > aide-termux/build.gradle
        echo "apply plugin: 'com.android.application'; android { compileSdkVersion 33; buildToolsVersion '30.0.3'; defaultConfig { applicationId 'com.termux'; minSdkVersion 21 } }; dependencies { implementation project(':terminal-emulator'); implementation project(':terminal-view'); implementation project(':termux-shared'); implementation 'androidx.appcompat:appcompat:1.3.1'; implementation 'com.google.android.material:material:1.4.0' }" > app/build.gradle
        echo "apply plugin: 'com.android.library'; android { compileSdkVersion 33; buildToolsVersion '30.0.3' }" > terminal-emulator/build.gradle
        echo "apply plugin: 'com.android.library'; android { compileSdkVersion 33; buildToolsVersion '30.0.3' }; dependencies { implementation project(':terminal-emulator') }" > terminal-view/build.gradle
        echo "apply plugin: 'com.android.library'; android { compileSdkVersion 33; buildToolsVersion '30.0.3' }; dependencies { implementation 'org.lsposed.hiddenapibypass:hiddenapibypass:4.3'; implementation 'com.google.guava:guava:31.1-android' }" > termux-shared/build.gradle

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 6.7.1
        cache-disabled: true

    - name: Build APK (Assemble)
      run: |
        # 运行 clean 确保不使用旧缓存，assembleDebug 强制生成 APK
        gradle clean assembleDebug --no-daemon --stacktrace -x lint

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: AIDE-Termux-Build-Success
        path: "**/build/outputs/apk/**/*.apk"
        if-no-files-found: error
