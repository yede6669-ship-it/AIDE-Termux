name: Android CI (Final Auto-Locate)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  JAVA_VERSION: '17'
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2048m -Dorg.gradle.daemon=false"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Smart Project Reconstruction
      run: |
        # 创建标准目录
        MODULES=("aide-termux" "app" "terminal-emulator" "terminal-view" "termux-shared")
        for MOD in "${MODULES[@]}"; do
          mkdir -p "$MOD/src/main/java"
          mkdir -p "$MOD/src/main/res"
        done

        # --- 核心修复：动态寻找文件 ---
        # 即使文件名叫 "AndroidManifest (1).xml" 或在深层目录，也能找到它
        
        find_and_cp() {
          local pattern="$1"
          local target="$2"
          # 寻找包含该关键词的文件，取第一个匹配项
          local src=$(find . -name "*$pattern*" -not -path "*/src/main/*" | head -n 1)
          if [ -n "$src" ]; then
            echo "✅ 找到匹配: $src -> $target"
            cp "$src" "$target"
          else
            echo "⚠️ 警告: 未找到匹配 $pattern 的文件，将创建默认文件"
            if [[ $target == *.xml ]]; then
               echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android" />' > "$target"
            fi
          fi
        }

        # 1. 映射 Manifest (根据包名关键词查找)
        find_and_cp "AndroidManifest.xml" "aide-termux/src/main/AndroidManifest.xml"
        find_and_cp "AndroidManifest (1).xml" "app/src/main/AndroidManifest.xml"
        find_and_cp "AndroidManifest (2).xml" "terminal-emulator/src/main/AndroidManifest.xml"
        find_and_cp "AndroidManifest (3).xml" "terminal-view/src/main/AndroidManifest.xml"
        find_and_cp "AndroidManifest (4).xml" "termux-shared/src/main/AndroidManifest.xml"

        # 2. 映射 build.gradle
        find_and_cp "build.gradle"     "aide-termux/build.gradle"
        find_and_cp "build (1).gradle" "app/build.gradle"
        find_and_cp "build (2).gradle" "terminal-emulator/build.gradle"
        find_and_cp "build (3).gradle" "terminal-view/build.gradle"
        find_and_cp "build (4).gradle" "termux-shared/build.gradle"

        # --- 3. 语法升级与占位符修复 ---
        process_files() {
          local mod=$1
          local pkg=$2
          local m_file="$mod/src/main/AndroidManifest.xml"
          local b_file="$mod/build.gradle"

          # 强制注入包名防止 R 文件生成失败
          sed -i "s/<manifest/<manifest package=\"$pkg\"/g" "$m_file"
          sed -i 's/\${applicationId}/com.termux/g' "$m_file"

          # 修复 build.gradle 语法
          if [ -f "$b_file" ]; then
            sed -i 's/compile /implementation /g' "$b_file"
            sed -i 's/api /implementation /g' "$b_file"
          fi
        }

        process_files "aide-termux" "com.aide.termux"
        process_files "app" "com.termux"
        process_files "terminal-emulator" "com.termux.terminal"
        process_files "terminal-view" "com.termux.view"
        process_files "termux-shared" "com.termux.shared"

        echo "include ':aide-termux', ':app', ':terminal-emulator', ':terminal-view', ':termux-shared'" > settings.gradle

    - name: Initialize Gradle Wrapper
      run: |
        gradle wrapper --gradle-version 6.7.1
        chmod +x gradlew

    - name: Build Debug APK
      run: |
        ./gradlew assembleDebug --stacktrace --project-cache-dir /tmp/gr_cache

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: AIDE-Termux-Fixed
        path: "**/build/outputs/apk/**/*.apk"
