name: Android CI (Extreme Recovery Mode)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 17
      uses: android-actions/setup-android@v3 # 优先安装 SDK 环境

    - name: Install SDK & NDK
      run: |
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653" "platforms;android-33" "build-tools;30.0.3"

    - name: Switch to JDK 11 (Standard for AGP 4.1.0)
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle

    - name: Force Inject Gradle Wrapper
      run: |
        mkdir -p gradle/wrapper
        curl -L https://raw.githubusercontent.com/gradle/gradle/v6.7.1/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
        printf "distributionBase=GRADLE_USER_HOME\ndistributionPath=wrapper/dists\ndistributionUrl=https\://services.gradle.org/distributions/gradle-6.7.1-all.zip\nzipStoreBase=GRADLE_USER_HOME\nzipStorePath=wrapper/dists\n" > gradle/wrapper/gradle-wrapper.properties
        curl -L https://raw.githubusercontent.com/gradle/gradle/v6.7.1/gradlew -o gradlew
        chmod +x gradlew

    - name: Surgical Project Repair
      run: |
        # 1. 生成 settings.gradle
        MODULES=$(find . -maxdepth 2 -name "build.gradle" -not -path "./build.gradle" | sed "s|\./\(.*\)/build\.gradle|'\:\1'|" | paste -sd "," - | sed 's/,/, /g')
        echo "include $MODULES" > settings.gradle

        # 2. 生成根目录 build.gradle
        cat <<EOF > build.gradle
        buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:4.1.0' }
        }
        allprojects {
            repositories { google(); mavenCentral() }
        }
        EOF

        # 3. 物理修复所有 AndroidManifest.xml (最重要一步)
        # 强制注入 package="com.termux"，否则 AGP 4.1.0 会报错找不到包名
        echo "🚀 正在物理修复清单文件..."
        find . -name "AndroidManifest.xml" | while read -r manifest; do
          # 替换 ${applicationId} 为硬编码，防止解析失败
          sed -i 's/\${applicationId}/com.termux/g' "$manifest"
          
          # 如果清单中没有 package 属性，强行在 <manifest 标签中注入
          if ! grep -q "package=" "$manifest"; then
            sed -i 's/<manifest/<manifest package="com.termux"/g' "$manifest"
          fi
          echo "✅ 修复完成: $manifest"
        done

        # 4. 强制重写所有子模块 build.gradle
        find . -maxdepth 2 -name "build.gradle" -not -path "./build.gradle" | while read -r file; do
          if grep -q "android {" "$file"; then
            DIR_NAME=$(basename $(dirname "$file"))
            PKG_NAME="com.termux"
            
            PLUGIN="com.android.library"
            APP_ID_BLOCK=""
            if [[ "$file" == *"app"* ]]; then 
                PLUGIN="com.android.application"
                APP_ID_BLOCK="applicationId '$PKG_NAME'"
            fi
            
            cat <<EOF > "${file}.tmp"
        apply plugin: '$PLUGIN'
        android {
            compileSdkVersion 33
            buildToolsVersion "30.0.3"
            defaultConfig {
                $APP_ID_BLOCK
                minSdkVersion 21
                targetSdkVersion 33
                versionCode 1
                versionName "1.0"
                manifestPlaceholders = [applicationId: "$PKG_NAME"]
            }
            // 针对部分 AGP 版本，显式声明命名空间
            sourceSets {
                main {
                    manifest.srcFile 'src/main/AndroidManifest.xml'
                }
            }
            lintOptions { abortOnError false }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_1_8
                targetCompatibility JavaVersion.VERSION_1_8
            }
        }
        EOF
            # 仅保留原文件中的依赖部分
            sed -n '/dependencies {/,$p' "$file" >> "${file}.tmp"
            mv "${file}.tmp" "$file"
          fi
        done

        # 5. 全局清理 JCenter 引用
        find . -name "*.gradle" -type f -exec sed -i 's/jcenter()/mavenCentral()/g' {} +

    - name: Build All Modules
      run: ./gradlew assembleDebug -x lint --stacktrace --no-daemon

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Termux-AIDE-Fixed-APKs
        path: |
          **/build/outputs/apk/**/*.apk
          **/build/outputs/aar/**/*.aar
