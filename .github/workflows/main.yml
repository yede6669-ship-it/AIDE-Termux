name: Android CI (Full Dependency & SDK 34)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      env:
        JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}

    - name: Project Infrastructure Reconstruction
      run: |
        # 1. 模块归位
        for m in "terminal-emulator" "terminal-view" "termux-shared" "app"; do
          P=$(find . -maxdepth 3 -name "$m" -type d | head -n 1)
          [ -n "$P" ] && [ "$P" != "./$m" ] && mv "$P" "./$m" || true
        done

        # 2. 重写 terminal-emulator (基础)
        cat <<'EOF' > terminal-emulator/build.gradle
        apply plugin: 'com.android.library'
        android {
            compileSdk 34
            namespace "com.termux.terminal"
            defaultConfig { minSdk 21 }
        }
        dependencies {
            implementation 'androidx.annotation:annotation:1.7.0'
        }
        EOF

        # 3. 重写 termux-shared (依赖最重)
        cat <<'EOF' > termux-shared/build.gradle
        apply plugin: 'com.android.library'
        android {
            compileSdk 34
            namespace "com.termux.shared"
            defaultConfig { minSdk 21 }
        }
        dependencies {
            api project(':terminal-emulator')
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.11.0'
            implementation 'com.google.guava:guava:33.0.0-android'
            implementation 'androidx.annotation:annotation:1.7.0'
            implementation 'com.termux:termux-am-library:v2.0.0'
        }
        EOF

        # 4. 重写 terminal-view
        cat <<'EOF' > terminal-view/build.gradle
        apply plugin: 'com.android.library'
        android {
            compileSdk 34
            namespace "com.termux.view"
            defaultConfig { minSdk 21 }
        }
        dependencies {
            api project(':terminal-emulator')
            api project(':termux-shared')
            implementation 'androidx.annotation:annotation:1.7.0'
        }
        EOF

        # 5. 根目录配置：升级 AGP 以支持 SDK 34
        cat <<'EOF' > build.gradle
        buildscript {
            repositories { google(); mavenCentral(); maven { url 'https://jitpack.io' } }
            dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
        }
        allprojects {
            repositories { google(); mavenCentral(); maven { url 'https://jitpack.io' } }
            configurations.all {
                resolutionStrategy.eachDependency { details ->
                    if (details.requested.group == 'androidx.window') {
                        details.useVersion '1.2.0'
                    }
                }
            }
        }
        EOF

        echo "include ':app', ':terminal-emulator', ':terminal-view', ':termux-shared'" > settings.gradle
        
        cat <<'EOF' > gradle.properties
        android.useAndroidX=true
        android.enableJetifier=true
        android.nonTransitiveRClass=false
        EOF

        # 6. 重写主 App：对齐 SDK 34
        cat <<'EOF' > app/build.gradle
        apply plugin: 'com.android.application'
        android {
            compileSdk 34
            namespace "com.termux"
            defaultConfig {
                applicationId "com.termux"
                minSdk 21
                targetSdk 34
                versionCode 1
                versionName "1.0"
                ndk { abiFilters 'arm64-v8a' }
            }
            sourceSets { main { jniLibs.srcDirs = ['src/main/jniLibs'] } }
        }
        dependencies {
            implementation project(':terminal-emulator')
            implementation project(':terminal-view')
            implementation project(':termux-shared')
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.11.0'
        }
        EOF

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.5

    - name: Build APK
      run: |
        # 直接使用 Java 17 编译，因为 SDK 34 需要它
        gradle :app:assembleDebug --no-daemon --refresh-dependencies

    - name: Upload
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: Termux-SDK34-Build
        path: "app/build/outputs/apk/debug/*.apk"
