name: Android CI (XML Fix)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17 (For SDK Tooling)
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Set up JDK 11 (For Build)
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Project Hard Reset & XML Purge
      run: |
        # 1. 彻底清除之前生成的脏数据
        rm -rf aide-termux app terminal-emulator terminal-view termux-shared settings.gradle build.gradle
        
        # 2. 重新创建目录
        mkdir -p app/src/main/java app/src/main/res/values
        mkdir -p terminal-emulator/src/main/java
        mkdir -p terminal-view/src/main/java
        mkdir -p termux-shared/src/main/java

        # 3. 强制生成最纯净的 AndroidManifest.xml (避免任何重复或坏字符)
        # 使用 printf 确保没有 BOM 头和换行符问题
        printf '<?xml version="1.0" encoding="utf-8"?>\n<manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.termux">\n    <application/>\n</manifest>' > app/src/main/AndroidManifest.xml
        printf '<?xml version="1.0" encoding="utf-8"?>\n<manifest package="com.termux.terminal"/>' > terminal-emulator/src/main/AndroidManifest.xml
        printf '<?xml version="1.0" encoding="utf-8"?>\n<manifest package="com.termux.view"/>' > terminal-view/src/main/AndroidManifest.xml
        printf '<?xml version="1.0" encoding="utf-8"?>\n<manifest package="com.termux.shared"/>' > termux-shared/src/main/AndroidManifest.xml

        # 4. 打捞源码 (仅限 Java，避免误抓损坏的 XML)
        find . -name "*.java" ! -path "*/src/main/java/*" -exec cp --parents {} app/src/main/java/ \; || true
        
        # 补全基础资源
        printf '<resources>\n    <string name="app_name">Termux</string>\n</resources>' > app/src/main/res/values/strings.xml

        # 5. 生成配置文件
        echo "include ':app', ':terminal-emulator', ':terminal-view', ':termux-shared'" > settings.gradle

    - name: Configure Gradle
      run: |
        cat <<'EOF' > build.gradle
        buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:4.1.0' }
        }
        allprojects {
            repositories { google(); mavenCentral() }
        }
        EOF

        cat <<'EOF' > app/build.gradle
        apply plugin: 'com.android.application'
        android {
            compileSdkVersion 33
            defaultConfig { applicationId "com.termux"; minSdkVersion 21; targetSdkVersion 33 }
        }
        dependencies {
            implementation project(':terminal-emulator')
            implementation project(':terminal-view')
            implementation project(':termux-shared')
            implementation 'androidx.appcompat:appcompat:1.3.1'
        }
        EOF

        echo "apply plugin: 'com.android.library'; android { compileSdkVersion 33 }" > terminal-emulator/build.gradle
        echo "apply plugin: 'com.android.library'; android { compileSdkVersion 33 }; dependencies { implementation project(':terminal-emulator') }" > terminal-view/build.gradle
        echo "apply plugin: 'com.android.library'; android { compileSdkVersion 33 }" > termux-shared/build.gradle

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 6.7.1
        cache-disabled: true

    - name: Build APK
      run: |
        # 禁用守护进程，并分配充足堆内存
        export GRADLE_OPTS="-Xmx3072m -Dfile.encoding=UTF-8"
        gradle clean assembleDebug --no-daemon --stacktrace

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: Termux-Success-Build
        path: "**/build/outputs/apk/**/*.apk"
