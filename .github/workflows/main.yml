name: Android CI (Final Toolchain Fix)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # 关键：告诉 Android SDK 工具跳过 JDK 版本检查，允许在 JDK 11 下运行 SDK Manager
  SKIP_JDK_VERSION_CHECK: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      # 确保环境变量在此步骤生效
      env:
        SKIP_JDK_VERSION_CHECK: true

    - name: Atomic Project Reset
      run: |
        # 清理并创建极简单模块结构
        find . -maxdepth 1 ! -name '.' ! -name '.git' ! -name '.github' -exec rm -rf {} +
        mkdir -p app/src/main/java app/src/main/res/values
        
        # 写入纯净配置
        cat <<'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.termux">
            <application android:label="Termux"/>
        </manifest>
        EOF
        echo '<resources><string name="app_name">Termux</string></resources>' > app/src/main/res/values/strings.xml
        echo "include ':app'" > settings.gradle

    - name: Configure Gradle
      run: |
        cat <<'EOF' > build.gradle
        buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:7.0.4' }
        }
        allprojects {
            repositories { google(); mavenCentral() }
        }
        EOF

        cat <<'EOF' > app/build.gradle
        apply plugin: 'com.android.application'
        android {
            compileSdk 33
            defaultConfig {
                applicationId "com.termux"
                minSdk 21
                targetSdk 33
            }
        }
        dependencies {
            implementation 'androidx.appcompat:appcompat:1.3.1'
        }
        EOF

    - name: Setup Gradle 7.3.3
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 7.3.3
        cache-disabled: true

    - name: Build APK
      run: |
        # 强制使用 UTF-8 编码，防止 XML 解析时出现莫名其妙的堆栈错误
        export GRADLE_OPTS="-Dfile.encoding=UTF-8 -Xmx3g"
        gradle assembleDebug --no-daemon --stacktrace

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: Termux-Success-Build
        path: "app/build/outputs/apk/debug/*.apk"
