name: Android CI (Duplicate Resource Fix)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      env:
        JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}

    - name: Deep Project Cleaning & Merging
      run: |
        # 1. 模块归位
        for m in "terminal-emulator" "terminal-view" "termux-shared" "app"; do
          P=$(find . -maxdepth 3 -name "$m" -type d | head -n 1)
          [ -n "$P" ] && [ "$P" != "./$m" ] && mv "$P" "./$m" || true
        done

        # 2. 暴力修复源码与冲突资源
        # 替换第三方 Log
        find . -name "*.java" -exec sed -i 's/io.github.zeroaicy.util.Log/android.util.Log/g' {} +
        
        # 【关键】解决资源冲突：如果 app 中已存在，则删除子模块中的同名资源
        # 我们重点检查 drawable 和 layout 文件夹
        find termux-shared/src/main/res/ -type f | while read file; do
            filename=$(basename "$file")
            # 如果在 app 模块的相同路径下找到了同名文件，就删除 shared 里的
            find app/src/main/res/ -name "$filename" -exec rm -f "$file" \;
        done

        # 3. 重新定义 settings.gradle
        echo "include ':app', ':terminal-emulator'" > settings.gradle

        # 4. 配置根目录 build.gradle
        cat <<'EOF' > build.gradle
        buildscript {
            repositories { google(); mavenCentral(); maven { url 'https://jitpack.io' } }
            dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
        }
        allprojects {
            repositories { google(); mavenCentral(); maven { url 'https://jitpack.io' } }
        }
        EOF

        # 5. 配置基础模块 terminal-emulator
        cat <<'EOF' > terminal-emulator/build.gradle
        apply plugin: 'com.android.library'
        android {
            compileSdk 34
            namespace "com.termux.terminal"
            defaultConfig { minSdk 21 }
        }
        dependencies { implementation 'androidx.annotation:annotation:1.7.0' }
        EOF

        # 6. 配置 app 模块 (合并源码路径)
        cat <<'EOF' > app/build.gradle
        apply plugin: 'com.android.application'
        android {
            compileSdk 34
            namespace "com.termux"
            defaultConfig {
                applicationId "com.termux"
                minSdk 21
                targetSdk 34
                ndk { abiFilters 'arm64-v8a' }
            }
            sourceSets {
                main {
                    java.srcDirs = [
                        'src/main/java', 
                        '../termux-shared/src/main/java', 
                        '../terminal-view/src/main/java'
                    ]
                    res.srcDirs = [
                        'src/main/res', 
                        '../termux-shared/src/main/res', 
                        '../terminal-view/src/main/res'
                    ]
                    manifest.srcFile 'src/main/AndroidManifest.xml'
                    jniLibs.srcDirs = ['src/main/jniLibs']
                }
            }
            packagingOptions {
                pickFirst '**/libc++_shared.so'
            }
        }
        dependencies {
            implementation project(':terminal-emulator')
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.11.0'
            implementation 'com.google.guava:guava:33.0.0-android'
            implementation 'com.termux:termux-am-library:v2.0.0'
            implementation 'androidx.annotation:annotation:1.7.0'
        }
        EOF

        echo "android.useAndroidX=true" > gradle.properties
        echo "android.enableJetifier=true" >> gradle.properties
        echo "android.nonTransitiveRClass=false" >> gradle.properties

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.5

    - name: Build APK
      run: |
        gradle :app:assembleDebug --no-daemon -x lint
