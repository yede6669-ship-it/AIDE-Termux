name: Android CI (Annotation Fix)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      env:
        JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}

    - name: Set up Java 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Project Infrastructure Reconstruction
      run: |
        # 1. 模块归位
        for m in "terminal-emulator" "terminal-view" "termux-shared" "app"; do
          P=$(find . -maxdepth 3 -name "$m" -type d | head -n 1)
          [ -n "$P" ] && [ "$P" != "./$m" ] && mv "$P" "./$m" || true
        done

        # 2. 精确重写子模块 build.gradle (补全所有基础依赖)
        
        # terminal-emulator: 补充 annotation
        cat <<'EOF' > terminal-emulator/build.gradle
        apply plugin: 'com.android.library'
        android {
            compileSdk 31
            namespace "com.termux.terminal"
            defaultConfig { minSdk 21 }
        }
        dependencies {
            implementation 'androidx.annotation:annotation:1.2.0'
        }
        EOF

        # termux-shared: 补充基础库
        cat <<'EOF' > termux-shared/build.gradle
        apply plugin: 'com.android.library'
        android {
            compileSdk 31
            namespace "com.termux.shared"
            defaultConfig { minSdk 21 }
        }
        dependencies {
            implementation 'androidx.appcompat:appcompat:1.3.1'
            implementation 'androidx.annotation:annotation:1.2.0'
            implementation 'com.termux:termux-am-library:v2.0.0'
        }
        EOF

        # terminal-view: 补充依赖并修正注解
        cat <<'EOF' > terminal-view/build.gradle
        apply plugin: 'com.android.library'
        android {
            compileSdk 31
            namespace "com.termux.view"
            defaultConfig { minSdk 21 }
        }
        dependencies {
            implementation project(':terminal-emulator')
            implementation project(':termux-shared')
            implementation 'androidx.annotation:annotation:1.2.0'
        }
        EOF

        # 3. 根目录配置
        cat <<'EOF' > build.gradle
        buildscript {
            repositories { google(); mavenCentral(); maven { url 'https://jitpack.io' } }
            dependencies { classpath 'com.android.tools.build:gradle:7.4.2' }
        }
        allprojects {
            repositories { google(); mavenCentral(); maven { url 'https://jitpack.io' } }
            configurations.all {
                resolutionStrategy.eachDependency { details ->
                    if (details.requested.group == 'androidx.window') {
                        details.useVersion '1.0.0'
                    }
                }
            }
        }
        EOF

        echo "include ':app', ':terminal-emulator', ':terminal-view', ':termux-shared'" > settings.gradle
        
        cat <<'EOF' > gradle.properties
        android.useAndroidX=true
        android.enableJetifier=true
        android.suppressUnsupportedCompileSdk=31
        android.nonTransitiveRClass=false
        EOF

        # 4. 重写主 App
        cat <<'EOF' > app/build.gradle
        apply plugin: 'com.android.application'
        android {
            compileSdk 31
            namespace "com.termux"
            defaultConfig {
                applicationId "com.termux"
                minSdk 21
                targetSdk 31
                ndk { abiFilters 'arm64-v8a' }
            }
            sourceSets { main { jniLibs.srcDirs = ['src/main/jniLibs'] } }
        }
        dependencies {
            implementation project(':terminal-emulator')
            implementation project(':terminal-view')
            implementation project(':termux-shared')
            implementation 'androidx.appcompat:appcompat:1.3.1'
            implementation 'com.google.android.material:material:1.4.0'
        }
        EOF

    - name: Setup Gradle 7.5
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 7.5

    - name: Build APK
      run: |
        export JAVA_HOME=$JAVA_HOME_11_X64
        export PATH=$JAVA_HOME/bin:$PATH
        gradle :app:assembleDebug --no-daemon --refresh-dependencies

    - name: Upload
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: Termux-Success-Artifact
        path: "app/build/outputs/apk/debug/*.apk"
