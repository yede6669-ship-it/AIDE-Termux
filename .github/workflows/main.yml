name: Android CI (Environment Bridge Solution)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # 安装两个版本的 JDK，GitHub Actions 会记住它们的路径
    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        java-package: jdk

    - name: Set up Java 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        java-package: jdk

    # 此时默认 Java 环境是最后安装的 Java 11，我们需要切换回 17 来跑 SDK 安装
    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      env:
        JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }} # 强制在此步骤使用 Java 17

    - name: Atomic Project Reset
      run: |
        find . -maxdepth 1 ! -name '.' ! -name '.git' ! -name '.github' -exec rm -rf {} +
        mkdir -p app/src/main/java app/src/main/res/values
        
        cat <<'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.termux">
            <application android:label="Termux"/>
        </manifest>
        EOF
        echo '<resources><string name="app_name">Termux</string></resources>' > app/src/main/res/values/strings.xml
        echo "include ':app'" > settings.gradle

    - name: Configure Gradle
      run: |
        cat <<'EOF' > build.gradle
        buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:7.0.4' }
        }
        allprojects {
            repositories { google(); mavenCentral() }
        }
        EOF

        cat <<'EOF' > app/build.gradle
        apply plugin: 'com.android.application'
        android {
            compileSdk 33
            defaultConfig {
                applicationId "com.termux"
                minSdk 21
                targetSdk 33
            }
        }
        dependencies {
            implementation 'androidx.appcompat:appcompat:1.3.1'
        }
        EOF

    - name: Setup Gradle 7.3.3
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 7.3.3
        cache-disabled: true

    - name: Build APK (Force Java 11)
      run: |
        # 核心：在运行命令前，手动将 JAVA_HOME 指向 Java 11
        export JAVA_HOME=$JAVA_HOME_11_X64
        export PATH=$JAVA_HOME/bin:$PATH
        
        export GRADLE_OPTS="-Dfile.encoding=UTF-8 -Xmx3g"
        gradle assembleDebug --no-daemon --stacktrace

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: Termux-Final-Build
        path: "app/build/outputs/apk/debug/*.apk"
