name: Android CI (Modern Compatibility)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 17 (For SDK Manager)
      # 必须先用 17，否则 setup-android 会报错退出
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install NDK
      run: |
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653"

    - name: Switch to JDK 11 (For Build)
      # 环境准备好了，切回 JDK 11 准备编译
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle

    - name: Force Inject Gradle 6.7.1 Wrapper
      run: |
        echo "🚀 正在注入 Gradle 6.7.1..."
        mkdir -p gradle/wrapper
        curl -L https://raw.githubusercontent.com/gradle/gradle/v6.7.1/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
        printf "distributionBase=GRADLE_USER_HOME\ndistributionPath=wrapper/dists\ndistributionUrl=https\://services.gradle.org/distributions/gradle-6.7.1-all.zip\nzipStoreBase=GRADLE_USER_HOME\nzipStorePath=wrapper/dists\n" > gradle/wrapper/gradle-wrapper.properties
        curl -L https://raw.githubusercontent.com/gradle/gradle/v6.7.1/gradlew -o gradlew
        chmod +x gradlew

    - name: Patch Build Scripts
      run: |
        # 1. 修复仓库地址
        find . -name "*.gradle" -type f -exec sed -i 's/jcenter()/mavenCentral()/g' {} +
        find . -name "*.gradle" -type f -exec sed -i "s/google()/google()/g" {} +
        
        # 2. 尝试修复插件版本冲突
        # 如果你的项目 build.gradle 里的插件太老，这里强行修正为兼容 Gradle 6.7 的版本
        sed -i "s/classpath 'com.android.tools.build:gradle:.*'/classpath 'com.android.tools.build:gradle:4.1.0'/g" build.gradle || true

    - name: Build with Gradle
      # 在 JDK 11 环境下执行构建
      run: ./gradlew assembleRelease --stacktrace --no-daemon

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: AIDE-Termux-Package
        path: |
          **/build/outputs/apk/release/*.apk
          **/build/outputs/apk/*.apk
