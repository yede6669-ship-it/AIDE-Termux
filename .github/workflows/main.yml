name: Android CI (Full Code Link)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK & SDK
      uses: android-actions/setup-android@v3

    - name: Install Build Tools
      run: |
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653" "platforms;android-33" "build-tools;30.0.3"

    - name: Use JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle

    - name: Clean Environment
      run: |
        find . -name "build" -type d -exec rm -rf {} +
        mkdir -p gradle/wrapper
        curl -L https://raw.githubusercontent.com/gradle/gradle/v6.7.1/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
        printf "distributionBase=GRADLE_USER_HOME\ndistributionPath=wrapper/dists\ndistributionUrl=https\://services.gradle.org/distributions/gradle-6.7.1-all.zip\nzipStoreBase=GRADLE_USER_HOME\nzipStorePath=wrapper/dists\n" > gradle/wrapper/gradle-wrapper.properties
        curl -L https://raw.githubusercontent.com/gradle/gradle/v6.7.1/gradlew -o gradlew
        chmod +x gradlew

    - name: Deep Project Linker
      run: |
        # 1. 重建 settings.gradle
        MODULES=$(find . -maxdepth 2 -name "build.gradle" -not -path "./build.gradle" | sed "s|\./\(.*\)/build\.gradle|'\:\1'|" | paste -sd "," - | sed 's/,/, /g')
        echo "include $MODULES" > settings.gradle

        # 2. 重建根目录 build.gradle
        printf "buildscript {\n    repositories { google(); mavenCentral() }\n    dependencies { classpath 'com.android.tools.build:gradle:4.1.0' }\n}\nallprojects {\n    repositories { google(); mavenCentral() }\n}\n" > build.gradle

        # 3. 处理子模块
        find . -maxdepth 2 -name "build.gradle" -not -path "./build.gradle" | while read -r file; do
          MOD_DIR=$(dirname "$file")
          MOD_NAME=$(basename "$MOD_DIR")
          mkdir -p "$MOD_DIR/src/main"
          
          # 修复 Manifest
          REAL_M=$(find "$MOD_DIR" -name "AndroidManifest.xml" -not -path "*/build/*" | head -n 1)
          [ -n "$REAL_M" ] && cp "$REAL_M" "$MOD_DIR/src/main/AndroidManifest.xml"
          MPATH="$MOD_DIR/src/main/AndroidManifest.xml"
          if [ ! -f "$MPATH" ]; then
            echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.termux.'$MOD_NAME'" />' > "$MPATH"
          else
            sed -i 's/\${applicationId}/com.termux/g' "$MPATH"
            grep -q "package=" "$MPATH" || sed -i 's/<manifest/<manifest package="com.termux.'$MOD_NAME'"/g' "$MPATH"
          fi

          # 4. 重新构建 build.gradle
          PLUGIN="com.android.library"
          [[ "$MOD_DIR" == *"app"* ]] && PLUGIN="com.android.application"
          
          printf "apply plugin: '$PLUGIN'\nandroid {\n    compileSdkVersion 33\n    buildToolsVersion '30.0.3'\n    defaultConfig {\n" > "${file}.tmp"
          [[ "$PLUGIN" == "com.android.application" ]] && printf "        applicationId 'com.termux'\n" >> "${file}.tmp"
          printf "        minSdkVersion 21\n        targetSdkVersion 33\n        versionCode 1\n        versionName '1.0'\n        manifestPlaceholders = [applicationId: 'com.termux']\n    }\n" >> "${file}.tmp"
          # 关键：启用资源合并和老旧代码支持
          printf "    lintOptions { abortOnError false }\n    dexOptions { preDexLibraries false }\n    packagingOptions { pickFirst 'lib/*/libtermux.so' }\n}\n" >> "${file}.tmp"
          
          # 5. 恢复所有依赖（包括 project 依赖）
          printf "dependencies {\n    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])\n" >> "${file}.tmp"
          if grep -q "dependencies {" "$file"; then
             # 提取 implementation/api/compile 并清理格式
             grep -E "implementation|api|compile" "$file" | grep -v "fileTree" >> "${file}.tmp" || true
          fi
          printf "}\n" >> "${file}.tmp"
          mv "${file}.tmp" "$file"
        done

    - name: Build and Debug
      run: ./gradlew assembleDebug --no-daemon --stacktrace || ./gradlew assembleDebug --no-daemon --stacktrace --info

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Termux-Full-Build
        path: |
          **/build/outputs/apk/**/*.apk
          **/build/outputs/aar/**/*.aar
