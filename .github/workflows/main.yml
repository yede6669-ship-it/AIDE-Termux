name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # 支持手动触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive # 如果项目有子模块，必须开启

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17' # Compose 项目强制要求 JDK 17 或更高
        distribution: 'temurin'
        cache: gradle

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653"
        # 注意：这里的 NDK 版本应与 build.gradle 中的 ndkVersion 一致

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleRelease --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: il2Fusion-Release
        path: |
          app/build/outputs/apk/release/*.apk
          module/build/outputs/zygisk/*.zip
