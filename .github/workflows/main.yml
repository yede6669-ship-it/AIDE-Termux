name: Android CI (Debug Build)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Clean and Reconstruct
      run: |
        # 清理
        rm -rf aide-termux app terminal-emulator terminal-view termux-shared settings.gradle build.gradle
        mkdir -p aide-termux/src/main/java app/src/main/java terminal-emulator/src/main/java terminal-view/src/main/java termux-shared/src/main/java

        # 映射清单 (确保 package 属性存在)
        echo "<?xml version='1.0' encoding='utf-8'?><manifest package='com.aide.termux'/>" > aide-termux/src/main/AndroidManifest.xml
        echo "<?xml version='1.0' encoding='utf-8'?><manifest package='com.termux'/>" > app/src/main/AndroidManifest.xml
        echo "<?xml version='1.0' encoding='utf-8'?><manifest package='com.termux.terminal'/>" > terminal-emulator/src/main/AndroidManifest.xml
        echo "<?xml version='1.0' encoding='utf-8'?><manifest package='com.termux.view'/>" > terminal-view/src/main/AndroidManifest.xml
        echo "<?xml version='1.0' encoding='utf-8'?><manifest package='com.termux.shared'/>" > termux-shared/src/main/AndroidManifest.xml

        # 生成根 build.gradle
        cat <<'EOF' > build.gradle
        buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:4.1.0' }
        }
        allprojects {
            repositories { google(); mavenCentral() }
        }
        EOF

        echo "include ':aide-termux', ':app', ':terminal-emulator', ':terminal-view', ':termux-shared'" > settings.gradle

        # 为每个模块生成更健壮的 build.gradle
        # aide-termux
        echo "apply plugin: 'com.android.application'; android { compileSdkVersion 33; defaultConfig { applicationId 'com.aide.termux'; minSdkVersion 24; targetSdkVersion 33 } }; dependencies { implementation project(':app') }" > aide-termux/build.gradle
        
        # app
        echo "apply plugin: 'com.android.application'; android { compileSdkVersion 33; defaultConfig { applicationId 'com.termux'; minSdkVersion 21; targetSdkVersion 33 } }; dependencies { implementation project(':terminal-emulator'); implementation project(':terminal-view'); implementation project(':termux-shared'); implementation 'androidx.appcompat:appcompat:1.3.1' }" > app/build.gradle
        
        # libraries
        echo "apply plugin: 'com.android.library'; android { compileSdkVersion 33; defaultConfig { minSdkVersion 21 } }" > terminal-emulator/build.gradle
        echo "apply plugin: 'com.android.library'; android { compileSdkVersion 33; defaultConfig { minSdkVersion 21 } }; dependencies { implementation project(':terminal-emulator') }" > terminal-view/build.gradle
        echo "apply plugin: 'com.android.library'; android { compileSdkVersion 33; defaultConfig { minSdkVersion 21 } }" > termux-shared/build.gradle

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 6.7.1
        cache-disabled: true

    - name: Build with Gradle
      run: |
        # 增加 --info 模式以获取更多报错细节
        export GRADLE_OPTS="-Xmx2048m -Dorg.gradle.jvmargs='--add-opens java.base/java.lang=ALL-UNNAMED --add-opens java.base/java.io=ALL-UNNAMED --add-exports java.base/sun.nio.ch=ALL-UNNAMED'"
        gradle assembleDebug --no-daemon --stacktrace --info
