name: Android CI (Legacy Support Fix)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  JAVA_VERSION: '17'
  # 强制 Gradle 使用更现代的内存配置，并忽略高版本的干扰
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2048m -Dorg.gradle.daemon=false -Dorg.gradle.configureondemand=false"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Surgical Reconstruction
      run: |
        # 1. 创建模块目录
        MODULES=("aide-termux" "app" "terminal-emulator" "terminal-view" "termux-shared")
        for MOD in "${MODULES[@]}"; do
          mkdir -p "$MOD/src/main/java"
          mkdir -p "$MOD/src/main/res"
        done

        # 2. 动态寻找并安置文件 (解决 cp 找不到文件的问题)
        find_file() {
          find . -name "$1" -not -path "*/src/main/*" | head -n 1
        }

        cp "$(find_file "AndroidManifest.xml")"     "aide-termux/src/main/AndroidManifest.xml" || echo "<manifest package='com.aide.termux'/>" > "aide-termux/src/main/AndroidManifest.xml"
        cp "$(find_file "AndroidManifest (1).xml")" "app/src/main/AndroidManifest.xml"
        cp "$(find_file "AndroidManifest (2).xml")" "terminal-emulator/src/main/AndroidManifest.xml"
        cp "$(find_file "AndroidManifest (3).xml")" "terminal-view/src/main/AndroidManifest.xml"
        cp "$(find_file "AndroidManifest (4).xml")" "termux-shared/src/main/AndroidManifest.xml"

        # 3. 生成【全新】的根 build.gradle (避开 jcenter 错误)
        # 不要使用你上传的那个根 build.gradle，它太旧了
        cat <<EOF > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:4.1.0'
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        EOF

        # 4. 重新生成 settings.gradle
        echo "include ':aide-termux', ':app', ':terminal-emulator', ':terminal-view', ':termux-shared'" > settings.gradle

        # 5. 修复模块级 build.gradle (核心语法升级)
        process_mod_gradle() {
          local mod=$1
          local pkg=$2
          local target="$mod/build.gradle"
          local src=$(find_file "build${mod: -2}.gradle") # 尝试匹配带括号的文件
          
          # 针对不同模块生成标准的 build.gradle，不再直接 cp 上传的文件，因为旧语法必错
          PLUGIN="com.android.library"
          [[ "$mod" == "app" || "$mod" == "aide-termux" ]] && PLUGIN="com.android.application"
          
          cat <<EOF > "$target"
          apply plugin: '$PLUGIN'
          android {
              compileSdkVersion 33
              buildToolsVersion "30.0.3"
              defaultConfig {
                  minSdkVersion 21
                  targetSdkVersion 33
                  versionCode 1
                  versionName "1.0"
                  [[ "$PLUGIN" == "com.android.application" ]] && applicationId "$pkg"
              }
              sourceSets {
                  main {
                      manifest.srcFile 'src/main/AndroidManifest.xml'
                      java.srcDirs = ['src/main/java', 'java', 'src']
                      res.srcDirs = ['src/main/res', 'res']
                  }
              }
              lintOptions { abortOnError false }
          }
          dependencies {
              implementation fileTree(dir: 'libs', include: ['*.jar'])
              implementation 'androidx.appcompat:appcompat:1.3.1'
              implementation 'com.google.android.material:material:1.4.0'
              if ("$mod" == "app") {
                  implementation project(':terminal-emulator')
                  implementation project(':terminal-view')
                  implementation project(':termux-shared')
              }
          }
        EOF
        }

        process_mod_gradle "aide-termux" "com.aide.termux"
        process_mod_gradle "app" "com.termux"
        process_mod_gradle "terminal-emulator" "com.termux.terminal"
        process_mod_gradle "terminal-view" "com.termux.view"
        process_mod_gradle "termux-shared" "com.termux.shared"

    - name: Force Gradle Downgrade
      run: |
        # 因为环境里的 Gradle 9 太新了，我们必须强制下载一个能跑 AGP 4.1.0 的老版本
        wget -q https://services.gradle.org/distributions/gradle-6.7.1-bin.zip
        unzip -q gradle-6.7.1-bin.zip
        mv gradle-6.7.1 /opt/gradle
        echo "/opt/gradle/bin" >> $GITHUB_PATH

    - name: Build with Gradle 6.7.1
      run: |
        # 使用刚下载的老版本 Gradle 编译
        gradle assembleDebug --stacktrace --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: AIDE-Termux-Fixed-APK
        path: "**/build/outputs/apk/**/*.apk"
