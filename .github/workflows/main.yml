name: Android CI (Total Structure Alignment)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up SDK & NDK
      uses: android-actions/setup-android@v3

    - name: Install Components
      run: |
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653" "platforms;android-33" "build-tools;30.0.3"

    - name: Switch to JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle

    - name: Force Inject Gradle Wrapper
      run: |
        mkdir -p gradle/wrapper
        curl -L https://raw.githubusercontent.com/gradle/gradle/v6.7.1/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
        printf "distributionBase=GRADLE_USER_HOME\ndistributionPath=wrapper/dists\ndistributionUrl=https\://services.gradle.org/distributions/gradle-6.7.1-all.zip\nzipStoreBase=GRADLE_USER_HOME\nzipStorePath=wrapper/dists\n" > gradle/wrapper/gradle-wrapper.properties
        curl -L https://raw.githubusercontent.com/gradle/gradle/v6.7.1/gradlew -o gradlew
        chmod +x gradlew

    - name: Advanced Project Repair
      run: |
        # 1. 基础配置
        MODULES=$(find . -maxdepth 2 -name "build.gradle" -not -path "./build.gradle" | sed "s|\./\(.*\)/build\.gradle|'\:\1'|" | paste -sd "," - | sed 's/,/, /g')
        echo "include $MODULES" > settings.gradle

        cat <<EOF > build.gradle
        buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:4.1.0' }
        }
        allprojects {
            repositories { google(); mavenCentral() }
        }
        EOF

        # 2. 结构自愈与 Manifest 修复
        echo "🚀 正在执行结构对齐与清单修复..."
        find . -maxdepth 2 -name "build.gradle" -not -path "./build.gradle" | while read -r file; do
          MOD_DIR=$(dirname "$file")
          
          # 确保存在标准的 Android 目录结构
          mkdir -p "$MOD_DIR/src/main"
          
          # 寻找并移动可能位置不对的 AndroidManifest.xml
          REAL_MANIFEST=$(find "$MOD_DIR" -name "AndroidManifest.xml" | head -n 1)
          if [ -n "$REAL_MANIFEST" ] && [ "$REAL_MANIFEST" != "$MOD_DIR/src/main/AndroidManifest.xml" ]; then
             mv "$REAL_MANIFEST" "$MOD_DIR/src/main/AndroidManifest.xml"
          fi

          # 物理注入 Package 属性
          MANIFEST_PATH="$MOD_DIR/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_PATH" ]; then
            sed -i 's/\${applicationId}/com.termux/g' "$MANIFEST_PATH"
            if ! grep -q "package=" "$MANIFEST_PATH"; then
              sed -i 's/<manifest/<manifest package="com.termux"/g' "$MANIFEST_PATH"
            fi
          else
            # 兜底：如果完全没有 Manifest，创建一个最小化的
            cat <<EOF > "$MANIFEST_PATH"
            <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.termux" />
EOF
          fi

          # 3. 强力重写 build.gradle
          PKG_NAME="com.termux"
          PLUGIN="com.android.library"
          [ "$MOD_DIR" == "./app" ] && PLUGIN="com.android.application"
          
          cat <<EOF > "${file}.tmp"
        apply plugin: '$PLUGIN'
        android {
            compileSdkVersion 33
            buildToolsVersion "30.0.3"
            defaultConfig {
                minSdkVersion 21
                targetSdkVersion 33
                versionCode 1
                versionName "1.0"
                manifestPlaceholders = [applicationId: "$PKG_NAME"]
            }
            // 解决资源报错
            aaptOptions { namespaced = false }
            lintOptions { abortOnError false }
        }
EOF
          # 试图恢复原有的 dependencies，如果报错则需要手动检查
          if grep -q "dependencies {" "$file"; then
            sed -n '/dependencies {/,$p' "$file" >> "${file}.tmp"
          else
            echo "dependencies { implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar']) }" >> "${file}.tmp"
          fi
          mv "${file}.tmp" "$file"
        done

    - name: Build with Stacktrace
      run: ./gradlew assembleDebug -x lint --stacktrace --no-daemon

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: AIDE-Termux-Aligned-Build
        path: |
          **/build/outputs/apk/**/*.apk
          **/build/outputs/aar/**/*.aar
