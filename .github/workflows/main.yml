name: Android CI (Final Fix)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 17 (For SDK Manager)
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install NDK
      run: |
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653"

    - name: Switch to JDK 11 (For Build)
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle

    - name: Force Inject Gradle 6.7.1 Wrapper
      run: |
        echo "🚀 正在注入 Gradle 6.7.1..."
        mkdir -p gradle/wrapper
        curl -L https://raw.githubusercontent.com/gradle/gradle/v6.7.1/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
        printf "distributionBase=GRADLE_USER_HOME\ndistributionPath=wrapper/dists\ndistributionUrl=https\://services.gradle.org/distributions/gradle-6.7.1-all.zip\nzipStoreBase=GRADLE_USER_HOME\nzipStorePath=wrapper/dists\n" > gradle/wrapper/gradle-wrapper.properties
        curl -L https://raw.githubusercontent.com/gradle/gradle/v6.7.1/gradlew -o gradlew
        chmod +x gradlew

    - name: Patch Build Scripts (Injecting Repositories)
      run: |
        # 1. 强行在根目录 build.gradle 的最顶端注入 google() 仓库
        # 这样可以确保 Gradle 在寻找插件时能看到 Google 仓库
        sed -i "1i buildscript { repositories { google(); mavenCentral() } }" build.gradle
        
        # 2. 全局替换 jcenter 为 mavenCentral
        find . -name "*.gradle" -type f -exec sed -i 's/jcenter()/mavenCentral()/g' {} +
        find . -name "*.gradle" -type f -exec sed -i "s/google()/google()/g" {} +
        
        # 3. 强制统一插件版本。如果原来的 classpath 匹配失败，直接在 buildscript 块里追加一个
        # 注意：这里我们尝试匹配常见的 classpath 定义并替换
        sed -i "s/classpath ['\"]com.android.tools.build:gradle:.*['\"]/classpath 'com.android.tools.build:gradle:4.1.0'/g" build.gradle || true

    - name: Build with Gradle
      run: ./gradlew assembleRelease --stacktrace --no-daemon

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: AIDE-Termux-Final-Build
        path: |
          **/build/outputs/apk/release/*.apk
          **/build/outputs/apk/*.apk
          **/build/outputs/bundle/release/*.aab
