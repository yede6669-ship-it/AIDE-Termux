name: Android CI (Extreme Cleanup)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # 强制关闭所有增量功能，只求编译成功
  GRADLE_OPTS: >-
    -Dorg.gradle.jvmargs=-Xmx2048m 
    -Dorg.gradle.vfs.watch=false 
    -Dorg.gradle.daemon=false 
    -Dorg.gradle.configureondemand=false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK & SDK
      uses: android-actions/setup-android@v3

    - name: Install Build Tools
      run: |
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653" "platforms;android-33" "build-tools;30.0.3"

    - name: Use JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Nuclear Cleanup (AIDE & Gradle)
      run: |
        # 物理删除所有可能干扰 Gradle 快照的非源码文件夹
        find . -name "build" -type d -exec rm -rf {} +
        find . -name ".gradle" -type d -exec rm -rf {} +
        find . -name ".aide" -type d -exec rm -rf {} +
        find . -name "gen" -type d -exec rm -rf {} +
        find . -name "bin" -type d -exec rm -rf {} +
        
        # 重新初始化 Wrapper
        mkdir -p gradle/wrapper
        curl -L https://raw.githubusercontent.com/gradle/gradle/v6.7.1/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
        printf "distributionBase=GRADLE_USER_HOME\ndistributionPath=wrapper/dists\ndistributionUrl=https\://services.gradle.org/distributions/gradle-6.7.1-all.zip\nzipStoreBase=GRADLE_USER_HOME\nzipStorePath=wrapper/dists\n" > gradle/wrapper/gradle-wrapper.properties
        curl -L https://raw.githubusercontent.com/gradle/gradle/v6.7.1/gradlew -o gradlew
        chmod +x gradlew

    - name: Atomic Reconstruction
      run: |
        # 识别模块
        MODULE_LIST=$(find . -maxdepth 2 -name "build.gradle" -not -path "./build.gradle" | sed "s|\./\(.*\)/build\.gradle|\1|")
        
        # 生成配置
        echo "// Forced Clean Settings" > settings.gradle
        for MOD in $MODULE_LIST; do
          echo "include ':$MOD'" >> settings.gradle
        done

        printf "buildscript {\n    repositories { google(); mavenCentral() }\n    dependencies { classpath 'com.android.tools.build:gradle:4.1.0' }\n}\nallprojects {\n    repositories { google(); mavenCentral() }\n}\n" > build.gradle

        for MOD_NAME in $MODULE_LIST; do
          MOD_DIR="./$MOD_NAME"
          TARGET_M_DIR="$MOD_DIR/src/main"
          TARGET_M_PATH="$TARGET_M_DIR/AndroidManifest.xml"
          mkdir -p "$TARGET_M_DIR"
          
          # 移动 Manifest
          REAL_M=$(find "$MOD_DIR" -name "AndroidManifest.xml" -not -path "*/src/main/*" -not -path "*/build/*" | head -n 1)
          if [ -n "$REAL_M" ]; then
             cp "$REAL_M" "$TARGET_M_PATH"
          fi

          # 强制对齐包名
          SAFE_PKG="com.termux.${MOD_NAME//-/_}"
          if [ ! -f "$TARGET_M_PATH" ]; then
            printf '<manifest xmlns:android="http://schemas.android.com/apk/res/android" package="%s" />\n' "$SAFE_PKG" > "$TARGET_M_PATH"
          else
            sed -i "s/package=\"[^\"]*\"/package=\"$SAFE_PKG\"/g" "$TARGET_M_PATH"
            grep -q "package=" "$TARGET_M_PATH" || sed -i "s/<manifest/<manifest package=\"$SAFE_PKG\"/g" "$TARGET_M_PATH"
          fi

          # 生成 build.gradle
          BFILE="$MOD_DIR/build.gradle"
          PLUGIN="com.android.library"; [[ "$MOD_NAME" == "app" ]] && PLUGIN="com.android.application"
          
          printf "apply plugin: '%s'\nandroid {\n    compileSdkVersion 33\n    buildToolsVersion '30.0.3'\n    defaultConfig {\n" "$PLUGIN" > "$BFILE"
          [[ "$PLUGIN" == "com.android.application" ]] && printf "        applicationId 'com.termux'\n" >> "$BFILE"
          printf "        minSdkVersion 21\n        targetSdkVersion 33\n    }\n    lintOptions { abortOnError false }\n}\ndependencies {\n    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])\n" >> "$BFILE"
          if [[ "$MOD_NAME" == "app" ]]; then
              for OTHER_MOD in $MODULE_LIST; do
                  [[ "$OTHER_MOD" != "app" ]] && printf "    implementation project(':%s')\n" "$OTHER_MOD" >> "$BFILE"
              done
          fi
          printf "}\n" >> "$BFILE"
        done

    - name: Build Nuclear APK
      # 使用 --no-daemon 和彻底关闭缓存，防止任何快照校验
      run: ./gradlew assembleDebug --no-daemon --no-build-cache --no-scan --stacktrace

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Termux-Nuclear-Build
        path: |
          **/build/outputs/apk/**/*.apk
          **/build/outputs/aar/**/*.aar
