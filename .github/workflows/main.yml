name: Android CI (Final Fix)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 17 (For SDK Manager)
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install NDK
      run: |
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653"

    - name: Switch to JDK 11 (For Build)
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle

    - name: Force Inject Gradle 6.7.1 Wrapper
      run: |
        echo "🚀 正在注入 Gradle 6.7.1..."
        mkdir -p gradle/wrapper
        curl -L https://raw.githubusercontent.com/gradle/gradle/v6.7.1/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
        printf "distributionBase=GRADLE_USER_HOME\ndistributionPath=wrapper/dists\ndistributionUrl=https\://services.gradle.org/distributions/gradle-6.7.1-all.zip\nzipStoreBase=GRADLE_USER_HOME\nzipStorePath=wrapper/dists\n" > gradle/wrapper/gradle-wrapper.properties
        curl -L https://raw.githubusercontent.com/gradle/gradle/v6.7.1/gradlew -o gradlew
        chmod +x gradlew

    - name: Patch Build Scripts (Structural Reconstruction)
      run: |
        # 1. 修复根目录 build.gradle：确保 buildscript 块结构完整
        cat <<EOF > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:4.1.0'
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        EOF

        # 2. 修复 app/build.gradle：确保第一行就是 apply plugin
        # 移除原文件中的 buildFeatures 和 jcenter 引用
        sed -i 's/jcenter()/mavenCentral()/g' app/build.gradle
        sed -i '/buildFeatures {/,/}/d' app/build.gradle
        
        # 3. 预防 android() 找不到：确保文件开头声明了插件
        if ! grep -q "com.android.application" app/build.gradle; then
           sed -i '1i apply plugin: "com.android.application"' app/build.gradle
        fi

    - name: Build with Gradle
      # 添加 --no-daemon 确保内存不溢出
      run: ./gradlew assembleRelease --stacktrace --no-daemon

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: AIDE-Termux-Package
        path: |
          **/build/outputs/apk/release/*.apk
          **/build/outputs/apk/*.apk
