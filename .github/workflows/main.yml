name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install NDK
      run: |
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653"

    - name: Fix Legacy Gradle Scripts
      # 核心修复：自动把代码里死掉的 jcenter() 替换为安全的 mavenCentral()
      run: |
        find . -name "*.gradle" -type f -exec sed -i 's/jcenter()/mavenCentral()/g' {} +
        find . -name "*.gradle" -type f -exec sed -i 's/google()/google()/g' {} +

    - name: Restore Gradle Wrapper (Compatible Version)
      # 核心修复：生成 Gradle 7.5，这个版本还认识旧的语法
      run: |
        if [ ! -f "gradlew" ]; then
          echo "⚠️ 正在生成兼容版构建环境 (Gradle 7.5)..."
          gradle wrapper --gradle-version 7.5
        fi
        chmod +x gradlew

    - name: Build Release Binaries
      # 使用 --no-daemon 避免内存溢出
      run: ./gradlew assembleRelease --stacktrace --no-daemon

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: AIDE-Termux-Release
        path: |
          **/build/outputs/apk/release/*.apk
          **/build/outputs/zygisk/*.zip
