name: Android CI (Precise Reconstruction)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Organize Project Files
      run: |
        # 创建目录结构
        mkdir -p aide-termux/src/main app/src/main terminal-emulator/src/main terminal-view/src/main termux-shared/src/main
        
        # 1. 映射 AndroidManifest
        [ -f "AndroidManifest.xml" ] && cp "AndroidManifest.xml" "aide-termux/src/main/AndroidManifest.xml"
        [ -f "AndroidManifest (1).xml" ] && cp "AndroidManifest (1).xml" "app/src/main/AndroidManifest.xml"
        [ -f "AndroidManifest (2).xml" ] && cp "AndroidManifest (2).xml" "terminal-emulator/src/main/AndroidManifest.xml"
        [ -f "AndroidManifest (3).xml" ] && cp "AndroidManifest (3).xml" "terminal-view/src/main/AndroidManifest.xml"
        [ -f "AndroidManifest (4).xml" ] && cp "AndroidManifest (4).xml" "termux-shared/src/main/AndroidManifest.xml"

        # 2. 映射并修复 build.gradle (将 compile 替换为 implementation)
        fix_gradle() {
          sed -i 's/compile /implementation /g' "$1"
          sed -i 's/api /implementation /g' "$1"
          # 确保支持 AndroidX
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
        }

        [ -f "build.gradle" ] && cp "build.gradle" "aide-termux/build.gradle" && fix_gradle "aide-termux/build.gradle"
        [ -f "build (1).gradle" ] && cp "build (1).gradle" "app/build.gradle" && fix_gradle "app/build.gradle"
        [ -f "build (2).gradle" ] && cp "build (2).gradle" "terminal-emulator/build.gradle" && fix_gradle "terminal-emulator/build.gradle"
        [ -f "build (3).gradle" ] && cp "build (3).gradle" "terminal-view/build.gradle" && fix_gradle "terminal-view/build.gradle"
        [ -f "build (4).gradle" ] && cp "build (4).gradle" "termux-shared/build.gradle" && fix_gradle "termux-shared/build.gradle"

        # 3. 生成 settings.gradle
        echo "include ':aide-termux', ':app', ':terminal-emulator', ':terminal-view', ':termux-shared'" > settings.gradle

        # 4. 特殊修复：给 aide-termux 的清单补上 package，否则会报 8000 条错
        if ! grep -q "package=" "aide-termux/src/main/AndroidManifest.xml"; then
          sed -i 's/<manifest/<manifest package="com.aide.termux"/g' "aide-termux/src/main/AndroidManifest.xml"
        fi
        # 替换所有清单中的 ${applicationId} 占位符
        find . -name "AndroidManifest.xml" -exec sed -i 's/\${applicationId}/com.termux/g' {} +

    - name: Initialize Gradle Wrapper
      run: |
        gradle wrapper --gradle-version 6.7.1
        chmod +x gradlew

    - name: Build APK
      run: |
        ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: AIDE-Termux-Package
        path: "**/build/outputs/apk/**/*.apk"
