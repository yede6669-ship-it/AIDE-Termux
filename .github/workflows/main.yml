name: Android CI (Multi-Module Full Fix)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      env:
        JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}

    - name: Set up Java 11 (For Build)
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    # --- 关键修改：不再删除所有文件夹，只通过脚本修正配置 ---
    - name: Inject Configuration
      run: |
        # 1. 在根目录生成 gradle.properties
        cat <<'EOF' > gradle.properties
        android.useAndroidX=true
        android.enableJetifier=true
        android.suppressUnsupportedCompileSdk=31
        EOF

        # 2. 修正根目录的 settings.gradle，确保包含所有模块
        cat <<'EOF' > settings.gradle
        include ':app'
        include ':terminal-emulator'
        include ':terminal-view'
        include ':termux-shared'
        EOF

        # 3. 修正 app 模块的 build.gradle，确保它能找到 jniLibs
        # 注意：这里我们直接用 sed 或者重写 app/build.gradle
        # 为了保险，我们重写一个适配你结构的 app/build.gradle
        cat <<'EOF' > app/build.gradle
        apply plugin: 'com.android.application'
        android {
            compileSdk 31
            namespace "com.termux"
            defaultConfig {
                applicationId "com.termux"
                minSdk 21
                targetSdk 31
                ndk { abiFilters 'arm64-v8a' }
            }
            sourceSets {
                main {
                    jniLibs.srcDirs = ['src/main/jniLibs']
                }
            }
            packagingOptions {
                doNotStrip "**/libtermux-bootstrap.so"
                doNotStrip "**/libproot.so"
                doNotStrip "**/libLoader.so"
            }
        }
        dependencies {
            implementation project(':terminal-emulator')
            implementation project(':terminal-view')
            implementation project(':termux-shared')
            implementation 'androidx.appcompat:appcompat:1.3.1'
        }
        EOF

    - name: Setup Gradle 7.5
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 7.5

    - name: Build APK
      run: |
        export JAVA_HOME=$JAVA_HOME_11_X64
        export PATH=$JAVA_HOME/bin:$PATH
        # 使用 assembleDebug 编译 app 模块
        ./gradlew :app:assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Termux-MultiModule-APK
        path: "app/build/outputs/apk/debug/*.apk"
