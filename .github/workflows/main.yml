name: Android CI (Archaeology Hybrid)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 17 (To Satisfy SDK Manager)
      # 第一步：先用 JDK 17，让 sdkmanager 开心，通过验证
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Set up JDK 8 (For Actual Compilation)
      # 第二步：环境就绪后，强行把全局 Java 切换回 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'
        cache: gradle

    - name: Force Inject Gradle 2.2 Wrapper
      run: |
        echo "🚀 正在注入 Gradle 2.2 引导程序..."
        mkdir -p gradle/wrapper
        curl -L https://raw.githubusercontent.com/gradle/gradle/v2.2/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
        
        printf "distributionBase=GRADLE_USER_HOME\ndistributionPath=wrapper/dists\ndistributionUrl=https\://services.gradle.org/distributions/gradle-2.2-all.zip\nzipStoreBase=GRADLE_USER_HOME\nzipStorePath=wrapper/dists\n" > gradle/wrapper/gradle-wrapper.properties
        
        curl -L https://raw.githubusercontent.com/gradle/gradle/v2.2/gradlew -o gradlew
        chmod +x gradlew

    - name: Patch Legacy Build Scripts
      run: |
        # 考古修复：JCenter 已死，强换 MavenCentral 并在 root 注入 google 仓库
        find . -name "*.gradle" -type f -exec sed -i 's/jcenter()/mavenCentral()/g' {} +
        # 确保 buildscript 和 allprojects 都有 google()，否则老插件下不下来
        sed -i 's/repositories {/repositories {\n        google()/g' build.gradle

    - name: Build with Gradle 2.2
      # 此时执行环境是 JDK 8，能满足 Gradle 2.2 的要求
      run: ./gradlew assembleRelease --info

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: AIDE-Antique-Build
        path: |
          **/build/outputs/apk/*.apk
