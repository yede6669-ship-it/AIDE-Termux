name: Android CI (Archaeology Hybrid)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 17 (For SDK Manager)
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Set up JDK 8 (For Actual Compilation)
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'
        cache: gradle

    - name: Force Inject Gradle 2.2 Wrapper
      run: |
        echo "🚀 正在注入 Gradle 2.2 引导程序..."
        mkdir -p gradle/wrapper
        curl -L https://raw.githubusercontent.com/gradle/gradle/v2.2/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
        printf "distributionBase=GRADLE_USER_HOME\ndistributionPath=wrapper/dists\ndistributionUrl=https\://services.gradle.org/distributions/gradle-2.2-all.zip\nzipStoreBase=GRADLE_USER_HOME\nzipStorePath=wrapper/dists\n" > gradle/wrapper/gradle-wrapper.properties
        curl -L https://raw.githubusercontent.com/gradle/gradle/v2.2/gradlew -o gradlew
        chmod +x gradlew

    - name: Patch Legacy Build Scripts (Hardcore Fix)
      run: |
        # 1. 先把 jcenter 替换为 mavenCentral
        find . -name "*.gradle" -type f -exec sed -i 's/jcenter()/mavenCentral()/g' {} +
        
        # 2. 把不认识的 google() 替换为旧版 Gradle 认识的完整 URL 格式
        find . -name "*.gradle" -type f -exec sed -i "s/google()/maven { url 'https:\/\/maven.google.com' }/g" {} +
        
        # 3. 确保根目录 build.gradle 的 repositories 块里有这个地址
        # 我们直接强行在第一行插入
        sed -i "6i \        maven { url 'https:\/\/maven.google.com' }" build.gradle

    - name: Build with Gradle 2.2
      run: ./gradlew assembleRelease --info --stacktrace

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: AIDE-Antique-Build
        path: |
          **/build/outputs/apk/*.apk
