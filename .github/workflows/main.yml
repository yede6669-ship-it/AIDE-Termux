name: Android CI (Final Recovery)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install NDK & SDK Components
      run: |
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653" "platforms;android-33" "build-tools;30.0.3"

    - name: Switch to JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle

    - name: Force Inject Gradle Wrapper
      run: |
        mkdir -p gradle/wrapper
        curl -L https://raw.githubusercontent.com/gradle/gradle/v6.7.1/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
        printf "distributionBase=GRADLE_USER_HOME\ndistributionPath=wrapper/dists\ndistributionUrl=https\://services.gradle.org/distributions/gradle-6.7.1-all.zip\nzipStoreBase=GRADLE_USER_HOME\nzipStorePath=wrapper/dists\n" > gradle/wrapper/gradle-wrapper.properties
        curl -L https://raw.githubusercontent.com/gradle/gradle/v6.7.1/gradlew -o gradlew
        chmod +x gradlew

    - name: Radical Project Sanitization
      run: |
        # 1. 重新生成 settings.gradle
        MODULES=$(find . -maxdepth 2 -name "build.gradle" -not -path "./build.gradle" | sed "s|\./\(.*\)/build\.gradle|'\:\1'|" | paste -sd "," - | sed 's/,/, /g')
        echo "include $MODULES" > settings.gradle

        # 2. 重置根目录 build.gradle
        cat <<EOF > build.gradle
        buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:4.1.0' }
        }
        allprojects {
            repositories { google(); mavenCentral() }
        }
        EOF

        # 3. 强力重写所有子模块的 Gradle 脚本
        find . -maxdepth 2 -name "build.gradle" -not -path "./build.gradle" | while read -r file; do
          if grep -q "android {" "$file"; then
            PLUGIN="com.android.library"
            if [[ "$file" == *"app"* ]]; then PLUGIN="com.android.application"; fi
            
            # 提取 android { ... } 块之后的内容（保留依赖声明）
            # 这种方法会丢弃原本可能出错的 android 闭包配置，改用统一的模板
            cat <<EOF > "${file}.tmp"
        apply plugin: '$PLUGIN'

        android {
            compileSdkVersion 33
            buildToolsVersion "30.0.3"
            defaultConfig {
                minSdkVersion 21
                targetSdkVersion 33
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_1_8
                targetCompatibility JavaVersion.VERSION_1_8
            }
        }
        EOF
            # 只保留原文件中 dependencies { ... } 之后的内容
            sed -n '/dependencies {/,$p' "$file" >> "${file}.tmp"
            mv "${file}.tmp" "$file"
            echo "🔥 已强力重构模块脚本: $file"
          fi
        done

        # 4. 全局清理无效引用
        find . -name "*.gradle" -type f -exec sed -i 's/jcenter()/mavenCentral()/g' {} +

    - name: Build Debug APK
      run: ./gradlew assembleDebug -x lint --stacktrace --no-daemon

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: AIDE-Termux-Fixed-Build
        path: |
          **/build/outputs/apk/**/*.apk
          **/build/outputs/aar/**/*.aar
