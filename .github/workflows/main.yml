name: Android CI (Multi-Module Build Fix)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # 1. 准备环境：Java 17 用于工具链，Java 11 用于编译
    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      env:
        JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}

    - name: Set up Java 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    # 2. 注入全局工程配置 (彻底解决版本倒挂和依赖问题)
    - name: Inject Project Infrastructure
      run: |
        # 强制生成根目录 build.gradle：这是解决 "Required Gradle 2.2" 报错的关键
        cat <<'EOF' > build.gradle
        buildscript {
            repositories { google(); mavenCentral() }
            dependencies { 
                classpath 'com.android.tools.build:gradle:7.4.2' 
            }
        }
        allprojects {
            repositories { google(); mavenCentral() }
        }
        EOF

        # 强制生成全局 gradle.properties
        cat <<'EOF' > gradle.properties
        android.useAndroidX=true
        android.enableJetifier=true
        android.suppressUnsupportedCompileSdk=31
        EOF

        # 强制生成全局 settings.gradle (确保所有文件夹被正确识别为模块)
        cat <<'EOF' > settings.gradle
        include ':app'
        include ':terminal-emulator'
        include ':terminal-view'
        include ':termux-shared'
        EOF

        # 强制重写主 app 模块的编译逻辑
        mkdir -p app
        cat <<'EOF' > app/build.gradle
        apply plugin: 'com.android.application'
        android {
            compileSdk 31
            namespace "com.termux"
            defaultConfig {
                applicationId "com.termux"
                minSdk 21
                targetSdk 31
                versionCode 1
                versionName "1.0"
                ndk { abiFilters 'arm64-v8a' }
            }
            sourceSets {
                main {
                    // 指向你仓库中存放 .so 文件的真实位置
                    jniLibs.srcDirs = ['src/main/jniLibs']
                }
            }
            packagingOptions {
                // 核心：保护 Termux 的二进制库不被 strip 损坏
                doNotStrip "**/libtermux-bootstrap.so"
                doNotStrip "**/libproot.so"
                doNotStrip "**/libLoader.so"
                resources {
                    excludes += '/META-INF/{AL2.0,LGPL2.1}'
                }
            }
        }
        dependencies {
            // 联动其他模块
            implementation project(':terminal-emulator')
            implementation project(':terminal-view')
            implementation project(':termux-shared')
            implementation 'androidx.appcompat:appcompat:1.3.1'
            implementation 'com.google.android.material:material:1.4.0'
        }
        EOF

    # 3. 配置 Gradle
    - name: Setup Gradle 7.5
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 7.5
        cache-disabled: true

    # 4. 执行编译
    - name: Build APK
      run: |
        export JAVA_HOME=$JAVA_HOME_11_X64
        export PATH=$JAVA_HOME/bin:$PATH
        
        # 优先使用项目自带的 gradlew，若无则使用全局 gradle
        if [ -f "./gradlew" ]; then
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
        else
          gradle :app:assembleDebug --no-daemon --stacktrace
        fi

    # 5. 上传最终产物
    - name: Upload Final APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: Termux-AIDE-Successful-Build
        path: "app/build/outputs/apk/debug/*.apk"
