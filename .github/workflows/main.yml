name: Android CI (Atomic Reconstruction v4)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # 增加 JVM 内存配额，解决快照阶段的超时隐患
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dorg.gradle.vfs.watch=false"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK & SDK
      uses: android-actions/setup-android@v3

    - name: Install Build Tools
      run: |
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653" "platforms;android-33" "build-tools;30.0.3"

    - name: Use JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        # 暂时关闭缓存，防止快照报错
        cache: '' 

    - name: Force Wrapper
      run: |
        mkdir -p gradle/wrapper
        curl -L https://raw.githubusercontent.com/gradle/gradle/v6.7.1/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
        printf "distributionBase=GRADLE_USER_HOME\ndistributionPath=wrapper/dists\ndistributionUrl=https\://services.gradle.org/distributions/gradle-6.7.1-all.zip\nzipStoreBase=GRADLE_USER_HOME\nzipStorePath=wrapper/dists\n" > gradle/wrapper/gradle-wrapper.properties
        curl -L https://raw.githubusercontent.com/gradle/gradle/v6.7.1/gradlew -o gradlew
        chmod +x gradlew

    - name: Atomic Reconstruction
      run: |
        # 1. 识别有效模块（过滤 build 文件夹）
        MODULE_LIST=$(find . -maxdepth 2 -name "build.gradle" -not -path "./build.gradle" -not -path "*/build/*" | sed "s|\./\(.*\)/build\.gradle|\1|")
        
        # 2. 生成 settings.gradle
        echo "// Build Fix" > settings.gradle
        for MOD in $MODULE_LIST; do
          echo "include ':$MOD'" >> settings.gradle
        done

        # 3. 根 build.gradle
        printf "buildscript {\n    repositories { google(); mavenCentral() }\n    dependencies { classpath 'com.android.tools.build:gradle:4.1.0' }\n}\nallprojects {\n    repositories { google(); mavenCentral() }\n}\n" > build.gradle

        # 4. 模块重构
        for MOD_NAME in $MODULE_LIST; do
          MOD_DIR="./$MOD_NAME"
          TARGET_M_DIR="$MOD_DIR/src/main"
          TARGET_M_PATH="$TARGET_M_DIR/AndroidManifest.xml"
          mkdir -p "$TARGET_M_DIR"
          
          # 物理移动 Manifest
          REAL_M=$(find "$MOD_DIR" -name "AndroidManifest.xml" -not -path "*/build/*" | head -n 1)
          if [ -n "$REAL_M" ] && [ "$(realpath "$REAL_M")" != "$(realpath "$TARGET_M_PATH" 2>/dev/null)" ]; then
             cp "$REAL_M" "$TARGET_M_PATH"
          fi

          # 包名统一
          SAFE_PKG="com.termux.${MOD_NAME//-/_}"
          if [ ! -f "$TARGET_M_PATH" ]; then
            printf '<manifest xmlns:android="http://schemas.android.com/apk/res/android" package="%s" />\n' "$SAFE_PKG" > "$TARGET_M_PATH"
          else
            sed -i "s/\${applicationId}/com.termux/g" "$TARGET_M_PATH"
            sed -i "s/package=\"[^\"]*\"/package=\"$SAFE_PKG\"/g" "$TARGET_M_PATH"
            if ! grep -q "package=" "$TARGET_M_PATH"; then
               sed -i "s/<manifest/<manifest package=\"$SAFE_PKG\"/g" "$TARGET_M_PATH"
            fi
          fi

          # 5. 生成 build.gradle
          BFILE="$MOD_DIR/build.gradle"
          PLUGIN="com.android.library"
          [[ "$MOD_NAME" == "app" ]] && PLUGIN="com.android.application"
          
          printf "apply plugin: '%s'\n\nandroid {\n    compileSdkVersion 33\n    buildToolsVersion '30.0.3'\n    defaultConfig {\n" "$PLUGIN" > "$BFILE"
          [[ "$PLUGIN" == "com.android.application" ]] && printf "        applicationId 'com.termux'\n" >> "$BFILE"
          printf "        minSdkVersion 21\n        targetSdkVersion 33\n        versionCode 1\n        versionName '1.0'\n        manifestPlaceholders = [applicationId: 'com.termux']\n    }\n" >> "$BFILE"
          printf "    lintOptions { abortOnError false }\n    packagingOptions { pickFirst 'lib/*/libtermux.so'; pickFirst '**/libc++_shared.so' }\n}\n\n" >> "$BFILE"
          
          # 依赖建立
          printf "dependencies {\n    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])\n" >> "$BFILE"
          if [[ "$MOD_NAME" == "app" ]]; then
              for OTHER_MOD in $MODULE_LIST; do
                  [[ "$OTHER_MOD" != "app" ]] && printf "    implementation project(':%s')\n" "$OTHER_MOD" >> "$BFILE"
              done
          fi
          printf "}\n" >> "$BFILE"
        done

    - name: Build Clean APK
      # 使用 --no-build-cache 和 --no-vfs-watch 强制跳过快照冲突
      run: ./gradlew clean assembleDebug --no-daemon --no-build-cache --stacktrace

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Termux-Build-Stable
        path: |
          **/build/outputs/apk/**/*.apk
          **/build/outputs/aar/**/*.aar
