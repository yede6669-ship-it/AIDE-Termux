name: Android CI (Final Version Alignment)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # 1. 准备环境
    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      env:
        JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}

    - name: Set up Java 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    # 2. 深度路径重构与语法手术
    - name: Deep Path & Syntax Reconstruction
      run: |
        # 自动寻找并归位子模块路径
        EMULATOR_PATH=$(find . -maxdepth 3 -name "terminal-emulator" -type d | head -n 1)
        VIEW_PATH=$(find . -maxdepth 3 -name "terminal-view" -type d | head -n 1)
        SHARED_PATH=$(find . -maxdepth 3 -name "termux-shared" -type d | head -n 1)
        APP_PATH=$(find . -maxdepth 3 -name "app" -type d | head -n 1)

        [ -n "$EMULATOR_PATH" ] && [ "$EMULATOR_PATH" != "./terminal-emulator" ] && mv $EMULATOR_PATH ./terminal-emulator || true
        [ -n "$VIEW_PATH" ] && [ "$VIEW_PATH" != "./terminal-view" ] && mv $VIEW_PATH ./terminal-view || true
        [ -n "$SHARED_PATH" ] && [ "$SHARED_PATH" != "./termux-shared" ] && mv $SHARED_PATH ./termux-shared || true
        [ -n "$APP_PATH" ] && [ "$APP_PATH" != "./app" ] && mv $APP_PATH ./app || true

        # 统一语法：修复 compile 报错
        find . -name "build.gradle" -exec sed -i 's/\bcompile\b/implementation/g' {} +
        find . -name "build.gradle" -exec sed -i 's/testCompile/testImplementation/g' {} +

        # 生成根目录霸权配置
        cat <<'EOF' > settings.gradle
        include ':app', ':terminal-emulator', ':terminal-view', ':termux-shared'
        EOF

        cat <<'EOF' > gradle.properties
        android.useAndroidX=true
        android.enableJetifier=true
        android.suppressUnsupportedCompileSdk=31
        org.gradle.parallel=false
        EOF

        cat <<'EOF' > build.gradle
        buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:7.4.2' }
        }
        allprojects {
            repositories { google(); mavenCentral() }
        }
        EOF

        # 强制重写主 app 配置，集成 JNI 库
        cat <<'EOF' > app/build.gradle
        apply plugin: 'com.android.application'
        android {
            compileSdk 31
            namespace "com.termux"
            defaultConfig {
                applicationId "com.termux"
                minSdk 21
                targetSdk 31
                ndk { abiFilters 'arm64-v8a' }
            }
            sourceSets { main { jniLibs.srcDirs = ['src/main/jniLibs'] } }
            packagingOptions {
                doNotStrip "**/libtermux-bootstrap.so"
                doNotStrip "**/libproot.so"
                doNotStrip "**/libLoader.so"
                pickFirsts += '**/libc++_shared.so'
            }
        }
        dependencies {
            implementation project(':terminal-emulator')
            implementation project(':terminal-view')
            implementation project(':termux-shared')
            implementation 'androidx.appcompat:appcompat:1.3.1'
        }
        EOF

    # 3. 锁定 Gradle 版本：确保它在 Java 11 下能跑
    - name: Setup Gradle 7.5
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 7.5
        cache-disabled: true

    # 4. 执行编译
    - name: Build APK
      run: |
        # 再次强制切换到 Java 11
        export JAVA_HOME=$JAVA_HOME_11_X64
        export PATH=$JAVA_HOME/bin:$PATH
        
        # 使用 gradle 7.5 进行编译，不使用 daemon 避免版本残留
        gradle :app:assembleDebug --no-daemon --stacktrace

    # 5. 上传
    - name: Upload
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: Termux-2MB-Ready-APK
        path: "app/build/outputs/apk/debug/*.apk"
