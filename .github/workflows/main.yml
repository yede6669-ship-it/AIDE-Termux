name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0 # 获取完整历史，防止某些脚本依赖 git tags

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Check Files Location
      # 这一步能帮你看到 gradlew 到底在哪
      run: |
        echo "当前目录内容:"
        ls -R | grep gradlew || echo "⚠️ 没找到 gradlew 文件！"

    - name: Build with Gradle
      # 使用 find 找到 gradlew 并执行，防止它不在根目录
      run: |
        GRADLEW_PATH=$(find . -name gradlew | head -n 1)
        if [ -z "$GRADLEW_PATH" ]; then
          echo "错误: 项目中找不到 gradlew，请检查仓库结构。"
          exit 1
        fi
        chmod +x "$GRADLEW_PATH"
        $GRADLEW_PATH assembleRelease --stacktrace --no-daemon

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: il2Fusion-Binaries
        path: |
          **/build/outputs/apk/release/*.apk
          **/build/outputs/zygisk/*.zip
