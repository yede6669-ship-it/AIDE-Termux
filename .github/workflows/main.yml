name: Android CI (Final Build Hack)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      env:
        JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}

    - name: Advanced Project Refactoring
      run: |
        # 1. 模块归位
        for m in "terminal-emulator" "terminal-view" "termux-shared" "app"; do
          P=$(find . -maxdepth 3 -name "$m" -type d | head -n 1)
          [ -n "$P" ] && [ "$P" != "./$m" ] && mv "$P" "./$m" || true
        done

        # 2. 暴力修复：移除找不到的第三方 Log 库，替换为原生 Log
        find . -name "*.java" -exec sed -i 's/io.github.zeroaicy.util.Log/android.util.Log/g' {} +

        # 3. 解决循环依赖：让 termux-shared 拥有访问所有源码的权限
        # 重写 terminal-emulator
        cat <<'EOF' > terminal-emulator/build.gradle
        apply plugin: 'com.android.library'
        android {
            compileSdk 34
            namespace "com.termux.terminal"
            defaultConfig { minSdk 21 }
        }
        dependencies { implementation 'androidx.annotation:annotation:1.7.0' }
        EOF

        # 重写 termux-shared (关键：现在它不再直接依赖 view，而是通过 app 统一协调)
        cat <<'EOF' > termux-shared/build.gradle
        apply plugin: 'com.android.library'
        android {
            compileSdk 34
            namespace "com.termux.shared"
            defaultConfig { minSdk 21 }
        }
        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.11.0'
            implementation 'com.google.guava:guava:33.0.0-android'
            implementation 'androidx.annotation:annotation:1.7.0'
            implementation 'com.termux:termux-am-library:v2.0.0'
            // 运行时依赖，不参与编译以打破循环，但我们需要解决编译时的 TerminalView 引用
            compileOnly project(':terminal-emulator')
            compileOnly project(':terminal-view')
        }
        EOF

        # 重写 terminal-view
        cat <<'EOF' > terminal-view/build.gradle
        apply plugin: 'com.android.library'
        android {
            compileSdk 34
            namespace "com.termux.view"
            defaultConfig { minSdk 21 }
        }
        dependencies {
            api project(':terminal-emulator')
            implementation project(':termux-shared')
        }
        EOF

        # 4. 根配置
        cat <<'EOF' > build.gradle
        buildscript {
            repositories { google(); mavenCentral(); maven { url 'https://jitpack.io' } }
            dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
        }
        allprojects {
            repositories { google(); mavenCentral(); maven { url 'https://jitpack.io' } }
        }
        EOF

        echo "include ':app', ':terminal-emulator', ':terminal-view', ':termux-shared'" > settings.gradle
        echo "android.useAndroidX=true" > gradle.properties
        echo "android.enableJetifier=true" >> gradle.properties
        echo "android.nonTransitiveRClass=false" >> gradle.properties

        # 5. 重写主 App (在这里完成最终合并)
        cat <<'EOF' > app/build.gradle
        apply plugin: 'com.android.application'
        android {
            compileSdk 34
            namespace "com.termux"
            defaultConfig {
                applicationId "com.termux"
                minSdk 21
                targetSdk 34
                ndk { abiFilters 'arm64-v8a' }
            }
        }
        dependencies {
            implementation project(':terminal-view')
            implementation project(':termux-shared')
            implementation project(':terminal-emulator')
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.11.0'
        }
        EOF

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.5

    - name: Build APK
      run: |
        # 强制忽略一些编译警告，尝试冲刺
        gradle :app:assembleDebug --no-daemon -x lint -x test
