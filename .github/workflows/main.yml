name: Android CI (Final Ultimate Success)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      env:
        JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}

    - name: Set up Java 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Super Project Reconstruction
      run: |
        # 1. 强制重写全局配置，禁用并行构建以提高稳定性
        cat <<'EOF' > gradle.properties
        android.useAndroidX=true
        android.enableJetifier=true
        android.suppressUnsupportedCompileSdk=31
        org.gradle.parallel=false
        org.gradle.configureondemand=false
        EOF

        # 2. 根目录 build.gradle 统一管理所有仓库
        cat <<'EOF' > build.gradle
        buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:7.4.2' }
        }
        allprojects {
            repositories { google(); mavenCentral() }
        }
        EOF

        # 3. 修复所有子模块的旧语法 (compile -> implementation)
        find . -name "build.gradle" -exec sed -i 's/\bcompile\b/implementation/g' {} +
        find . -name "build.gradle" -exec sed -i 's/testCompile/testImplementation/g' {} +

        # 4. 核心：重写 app/build.gradle，添加缺失的资源和容错处理
        mkdir -p app/src/main/res/values
        cat <<'EOF' > app/build.gradle
        apply plugin: 'com.android.application'
        android {
            compileSdk 31
            namespace "com.termux"
            defaultConfig {
                applicationId "com.termux"
                minSdk 21
                targetSdk 31
                versionCode 1
                versionName "1.0"
                ndk { abiFilters 'arm64-v8a' }
            }
            sourceSets {
                main { jniLibs.srcDirs = ['src/main/jniLibs'] }
            }
            packagingOptions {
                doNotStrip "**/libtermux-bootstrap.so"
                doNotStrip "**/libproot.so"
                doNotStrip "**/libLoader.so"
                resources {
                    excludes += '/META-INF/{AL2.0,LGPL2.1}'
                    pickFirsts += '**/libc++_shared.so'
                }
            }
            lintOptions {
                abortOnError false
                checkReleaseBuilds false
            }
        }
        dependencies {
            implementation project(':terminal-emulator')
            implementation project(':terminal-view')
            implementation project(':termux-shared')
            implementation 'androidx.appcompat:appcompat:1.3.1'
            implementation 'com.google.android.material:material:1.4.0'
        }
        EOF

    - name: Setup Gradle 7.5
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 7.5

    - name: Build APK
      run: |
        export JAVA_HOME=$JAVA_HOME_11_X64
        export PATH=$JAVA_HOME/bin:$PATH
        
        # 使用 --no-daemon 模式防止内存溢出导致的解析失败
        # 使用 -x lint 跳过耗时的检查
        if [ -f "./gradlew" ]; then
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon -x lint --stacktrace
        else
          gradle :app:assembleDebug --no-daemon -x lint --stacktrace
        fi

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: Termux-AIDE-Final-Success
        path: "app/build/outputs/apk/debug/*.apk"
