name: Android CI (Multi-Module Mode)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 17 (For SDK Manager)
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install NDK
      run: |
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653"

    - name: Switch to JDK 11 (For Build)
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle

    - name: Force Inject Gradle Wrapper
      run: |
        mkdir -p gradle/wrapper
        curl -L https://raw.githubusercontent.com/gradle/gradle/v6.7.1/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
        printf "distributionBase=GRADLE_USER_HOME\ndistributionPath=wrapper/dists\ndistributionUrl=https\://services.gradle.org/distributions/gradle-6.7.1-all.zip\nzipStoreBase=GRADLE_USER_HOME\nzipStorePath=wrapper/dists\n" > gradle/wrapper/gradle-wrapper.properties
        curl -L https://raw.githubusercontent.com/gradle/gradle/v6.7.1/gradlew -o gradlew
        chmod +x gradlew

    - name: Repair Project Structure
      run: |
        # 1. 修复 settings.gradle (核心修复：让 Gradle 认识所有模块)
        # 假设模块在根目录下，这通常是 AIDE 项目的结构
        echo "include ':app', ':terminal-view'" > settings.gradle

        # 2. 修复根目录 build.gradle
        cat <<EOF > build.gradle
        buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:4.1.0' }
        }
        allprojects {
            repositories { google(); mavenCentral() }
        }
        EOF

        # 3. 批量清洗所有子模块的语法错误
        # 修复 VERSION_8 笔误和清理 buildFeatures
        find . -name "*.gradle" -type f -exec sed -i 's/JavaVersion.VERSION_8/JavaVersion.VERSION_1_8/g' {} +
        find . -name "*.gradle" -type f -exec sed -i '/buildFeatures/,/}/d' {} +
        find . -name "*.gradle" -type f -exec sed -i 's/jcenter()/mavenCentral()/g' {} +

        # 4. 强制补全 app 模块插件
        if ! grep -q "com.android.application" app/build.gradle; then
           sed -i '1i apply plugin: "com.android.application"' app/build.gradle
        fi

    - name: Build Release APK
      # 尝试编译整个项目，跳过 lint
      run: ./gradlew assembleRelease -x lint --stacktrace --no-daemon

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: AIDE-Termux-Package
        path: |
          **/build/outputs/apk/**/*.apk
