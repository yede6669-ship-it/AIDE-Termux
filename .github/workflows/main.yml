name: Android CI (Final Survival Mode)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 17 (For SDK Manager)
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install NDK
      run: |
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653"

    - name: Switch to JDK 11 (For Build)
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle

    - name: Force Inject Gradle Wrapper
      run: |
        mkdir -p gradle/wrapper
        curl -L https://raw.githubusercontent.com/gradle/gradle/v6.7.1/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
        printf "distributionBase=GRADLE_USER_HOME\ndistributionPath=wrapper/dists\ndistributionUrl=https\://services.gradle.org/distributions/gradle-6.7.1-all.zip\nzipStoreBase=GRADLE_USER_HOME\nzipStorePath=wrapper/dists\n" > gradle/wrapper/gradle-wrapper.properties
        curl -L https://raw.githubusercontent.com/gradle/gradle/v6.7.1/gradlew -o gradlew
        chmod +x gradlew

    - name: Heavy Duty Script Patching
      run: |
        # 1. 彻底重写根目录 build.gradle
        cat <<EOF > build.gradle
        buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:4.1.0' }
        }
        allprojects {
            repositories { google(); mavenCentral() }
        }
        EOF

        # 2. 核心语法清洗 app/build.gradle
        # 修复 JavaVersion.VERSION_8 -> JavaVersion.VERSION_1_8
        sed -i 's/JavaVersion.VERSION_8/JavaVersion.VERSION_1_8/g' app/build.gradle
        
        # 修复 sourceCompatibility/targetCompatibility 的写法
        sed -i 's/sourceCompatibility VERSION_1_8/sourceCompatibility JavaVersion.VERSION_1_8/g' app/build.gradle
        sed -i 's/targetCompatibility VERSION_1_8/targetCompatibility JavaVersion.VERSION_1_8/g' app/build.gradle

        # 清除 buildFeatures 块
        sed -i '/buildFeatures/,/}/d' app/build.gradle
        
        # 3. 插件头部强制对齐
        echo "apply plugin: 'com.android.application'" > app/build.gradle.new
        grep -v "apply plugin" app/build.gradle >> app/build.gradle.new
        mv app/build.gradle.new app/build.gradle

    - name: Build Release APK
      # 加上 --no-daemon 避免内存抖动，跳过 lint 保证速度
      run: ./gradlew :app:assembleRelease -x lint --stacktrace --no-daemon

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: AIDE-Termux-Package
        path: |
          **/build/outputs/apk/release/*.apk
          app/build/outputs/apk/**/*.apk
