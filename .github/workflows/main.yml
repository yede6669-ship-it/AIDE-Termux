name: Android CI (Final Fixed Syntax)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Reconstruction Project Structure
      run: |
        # 清理环境
        rm -rf aide-termux app terminal-emulator terminal-view termux-shared settings.gradle build.gradle
        
        # 创建目录
        mkdir -p aide-termux/src/main app/src/main terminal-emulator/src/main terminal-view/src/main termux-shared/src/main

        # 映射清单文件
        cp "AndroidManifest.xml"     "aide-termux/src/main/AndroidManifest.xml" || touch "aide-termux/src/main/AndroidManifest.xml"
        cp "AndroidManifest (1).xml" "app/src/main/AndroidManifest.xml" || touch "app/src/main/AndroidManifest.xml"
        cp "AndroidManifest (2).xml" "terminal-emulator/src/main/AndroidManifest.xml" || touch "terminal-emulator/src/main/AndroidManifest.xml"
        cp "AndroidManifest (3).xml" "terminal-view/src/main/AndroidManifest.xml" || touch "terminal-view/src/main/AndroidManifest.xml"
        cp "AndroidManifest (4).xml" "termux-shared/src/main/AndroidManifest.xml" || touch "termux-shared/src/main/AndroidManifest.xml"

        # 生成根 build.gradle
        cat <<'EOF' > build.gradle
        buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:4.1.0' }
        }
        allprojects {
            repositories { google(); mavenCentral() }
        }
        EOF

        echo "include ':aide-termux', ':app', ':terminal-emulator', ':terminal-view', ':termux-shared'" > settings.gradle

        # 核心修复：简化模块生成逻辑，避开第 88 行的语法冲突
        generate_mod() {
          local mod=$1; local pkg=$2; local type=$3
          local b_path="$mod/build.gradle"
          
          # 先写入通用头部
          cat <<EOF > "$b_path"
          apply plugin: '$type'
          android {
              compileSdkVersion 33
              buildToolsVersion "30.0.3"
              defaultConfig {
                  minSdkVersion 21
                  targetSdkVersion 33
EOF
          # 如果是 application，注入 applicationId
          if [ "$type" == "com.android.application" ]; then
            echo "                applicationId '$pkg'" >> "$b_path"
          fi

          # 写入尾部依赖逻辑
          cat <<EOF >> "$b_path"
              }
              sourceSets { main { 
                  manifest.srcFile 'src/main/AndroidManifest.xml'
                  java.srcDirs = ['src/main/java', 'java', 'src']
                  res.srcDirs = ['src/main/res', 'res']
              } }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.3.1'
              implementation 'com.google.android.material:material:1.4.0'
              if ("$mod" == "app") {
                  implementation project(':terminal-emulator')
                  implementation project(':terminal-view')
                  implementation project(':termux-shared')
              }
              if ("$mod" == "aide-termux") {
                  implementation project(':app')
              }
          }
EOF
        }

        # 调用生成 (aide-termux 和 app 是 application，其余是 library)
        generate_mod "aide-termux" "com.aide.termux" "com.android.application"
        generate_mod "app" "com.termux" "com.android.application"
        generate_mod "terminal-emulator" "com.termux.terminal" "com.android.library"
        generate_mod "terminal-view" "com.termux.view" "com.android.library"
        generate_mod "termux-shared" "com.termux.shared" "com.android.library"

        # 修正清单占位符
        find . -name "AndroidManifest.xml" -exec sed -i 's/\${applicationId}/com.termux/g' {} +

    - name: Download Compatible Gradle
      run: |
        wget -q https://services.gradle.org/distributions/gradle-6.7.1-bin.zip
        unzip -q gradle-6.7.1-bin.zip
        echo "$(pwd)/gradle-6.7.1/bin" >> $GITHUB_PATH

    - name: Build Debug APK
      run: |
        gradle assembleDebug --no-daemon --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: AIDE-Termux-Package
        path: "**/build/outputs/apk/**/*.apk"
