name: Android CI (Final Fix)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK & SDK
      uses: android-actions/setup-android@v3

    - name: Install Build Tools
      run: |
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653" "platforms;android-33" "build-tools;30.0.3"

    - name: Use JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle

    - name: Clean Environment
      run: |
        find . -name "build" -type d -exec rm -rf {} +
        mkdir -p gradle/wrapper
        curl -L https://raw.githubusercontent.com/gradle/gradle/v6.7.1/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
        printf "distributionBase=GRADLE_USER_HOME\ndistributionPath=wrapper/dists\ndistributionUrl=https\://services.gradle.org/distributions/gradle-6.7.1-all.zip\nzipStoreBase=GRADLE_USER_HOME\nzipStorePath=wrapper/dists\n" > gradle/wrapper/gradle-wrapper.properties
        curl -L https://raw.githubusercontent.com/gradle/gradle/v6.7.1/gradlew -o gradlew
        chmod +x gradlew

    - name: Atomic Project Reconstruction
      run: |
        # 1. 扫描所有合法的子模块（带 build.gradle 的文件夹）
        MODULE_LIST=$(find . -maxdepth 2 -name "build.gradle" -not -path "./build.gradle" | sed "s|\./\(.*\)/build\.gradle|\1|")
        
        # 生成 settings.gradle
        echo "include $(echo "$MODULE_LIST" | sed "s|^|':'|" | paste -sd "," - | sed 's/,/, /g')" > settings.gradle

        # 2. 重建根目录 build.gradle
        printf "buildscript {\n    repositories { google(); mavenCentral() }\n    dependencies { classpath 'com.android.tools.build:gradle:4.1.0' }\n}\nallprojects {\n    repositories { google(); mavenCentral() }\n}\n" > build.gradle

        # 3. 逐个重构模块
        for MOD_NAME in $MODULE_LIST; do
          MOD_DIR="./$MOD_NAME"
          TARGET_M_DIR="$MOD_DIR/src/main"
          TARGET_M_PATH="$TARGET_M_DIR/AndroidManifest.xml"
          
          mkdir -p "$TARGET_M_DIR"
          
          # 修复 Manifest 物理位置
          REAL_M=$(find "$MOD_DIR" -name "AndroidManifest.xml" -not -path "*/build/*" | head -n 1)
          if [ -n "$REAL_M" ] && [ "$(realpath "$REAL_M")" != "$(realpath "$TARGET_M_PATH" 2>/dev/null)" ]; then
             cp "$REAL_M" "$TARGET_M_PATH"
          fi

          # 强制注入正确的包名（处理中划线为下划线）
          SAFE_PKG="com.termux.${MOD_NAME//-/_}"
          if [ ! -f "$TARGET_M_PATH" ]; then
            echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android" package="'$SAFE_PKG'" />' > "$TARGET_M_PATH"
          else
            sed -i 's/\${applicationId}/com.termux/g' "$TARGET_M_PATH"
            # 替换或添加 package 属性
            if grep -q "package=" "$TARGET_M_PATH"; then
               sed -i "s/package=\"[^\"]*\"/package=\"$SAFE_PKG\"/" "$TARGET_M_PATH"
            else
               sed -i "s/<manifest/<manifest package=\"$SAFE_PKG\"/" "$TARGET_M_PATH"
            fi
          fi

          # 4. 生成绝对干净且闭合的 build.gradle
          PLUGIN="com.android.library"
          [[ "$MOD_NAME" == "app" ]] && PLUGIN="com.android.application"
          
          BFILE="$MOD_DIR/build.gradle"
          printf "apply plugin: '$PLUGIN'\n\nandroid {\n    compileSdkVersion 33\n    buildToolsVersion '30.0.3'\n\n    defaultConfig {\n" > "$BFILE"
          [[ "$PLUGIN" == "com.android.application" ]] && printf "        applicationId 'com.termux'\n" >> "$BFILE"
          printf "        minSdkVersion 21\n        targetSdkVersion 33\n        versionCode 1\n        versionName '1.0'\n        manifestPlaceholders = [applicationId: 'com.termux']\n    }\n\n" >> "$BFILE"
          printf "    lintOptions { abortOnError false }\n    packagingOptions {\n        pickFirst 'lib/*/libtermux.so'\n        pickFirst '**/libc++_shared.so'\n    }\n}\n\n" >> "$BFILE"
          
          # 5. 自动重建依赖块（关键：确保闭合）
          printf "dependencies {\n    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])\n" >> "$BFILE"
          # 自动链接其他子模块（如果是 app 模块，链接所有其他模块）
          if [[ "$MOD_NAME" == "app" ]]; then
              for OTHER_MOD in $MODULE_LIST; do
                  [[ "$OTHER_MOD" != "app" ]] && printf "    implementation project(':$OTHER_MOD')\n" >> "$BFILE"
              done
          fi
          printf "}\n" >> "$BFILE"
          
          echo "✅ 模块 $MOD_NAME 结构已重组"
        done

    - name: Build APK
      run: ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Termux-Final-Build
        path: |
          **/build/outputs/apk/**/*.apk
          **/build/outputs/aar/**/*.aar
