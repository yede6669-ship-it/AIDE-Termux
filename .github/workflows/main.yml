name: Android CI (Legacy Archaeology Mode)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 8
      # Gradle 2.2 绝对跑不动 JDK 11/17，必须回退到 Java 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Force Inject Gradle 2.2 Wrapper
      # 强行注入那个时代的“心脏”
      run: |
        echo "🏺 正在启动考古模式：注入 Gradle 2.2..."
        mkdir -p gradle/wrapper
        curl -L https://raw.githubusercontent.com/gradle/gradle/v2.2/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
        
        printf "distributionBase=GRADLE_USER_HOME\ndistributionPath=wrapper/dists\ndistributionUrl=https\://services.gradle.org/distributions/gradle-2.2-all.zip\nzipStoreBase=GRADLE_USER_HOME\nzipStorePath=wrapper/dists\n" > gradle/wrapper/gradle-wrapper.properties
        
        curl -L https://raw.githubusercontent.com/gradle/gradle/v2.2/gradlew -o gradlew
        chmod +x gradlew

    - name: Fix Legacy Repositories
      # 那个年代连 mavenCentral 都不一定稳，强行加上 google 和 jcenter 的旧版镜像
      run: |
        find . -name "*.gradle" -type f -exec sed -i 's/jcenter()/jcenter()\n        google()/g' {} +
        # 很多旧项目缺少 google() 仓库定义
        find . -name "build.gradle" -type f -exec sed -i 's/repositories {/repositories {\n        google()/g' {} +

    - name: Build with Gradle 2.2
      # 考古版 Gradle 不支持很多现代参数，只求能跑通
      run: ./gradlew assembleRelease --info

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: AIDE-Termux-Antique-Output
        path: |
          **/build/outputs/apk/*.apk
